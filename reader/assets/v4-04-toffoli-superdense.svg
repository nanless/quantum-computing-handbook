  <rect class="subpanel" x="532" y="108" width="396" height="136" rx="9"/>
  <text class="smb c3-txt" x="544" y="127">A. 超密编码：1 ebit + 1 qubit → 2 cbits</text>
  <text class="smb" x="556" y="192" text-anchor="middle">|Φ⁺⟩</text>
