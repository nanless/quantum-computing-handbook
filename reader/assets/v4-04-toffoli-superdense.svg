  <rect class="c2-soft" x="319.9" y="274.0" width="25.0" height="24.0" rx="5"/>
  <text class="gate-txt c2-txt" x="332.4" y="290.5" text-anchor="middle">T</text>
  <line class="wire" x1="363.2" y1="174.0" x2="363.2" y2="221.0"/>
