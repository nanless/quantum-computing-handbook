<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Toffoli 门 6-CNOT 7-T 分解与超密编码隐形传态对偶电路</title>
  <desc id="desc">左面板展示无辅助 Toffoli 门的标准 15 门 Clifford+T 分解（6 CNOT、7 个 T/T† 与 2 个 H），并对比 4-T 临时逻辑与优化；右面板上下对照超密编码（1 ebit + 1 qubit → 2 cbits）与量子隐形传态（1 ebit + 2 cbits → 1 qubit）的镜像对偶电路结构。</desc>
