  <text class="gate-txt c1-txt" x="363.2" y="290.5" text-anchor="middle">H</text>
  <rect class="c2-soft" x="381.5" y="162.0" width="25.0" height="24.0" rx="5"/>
  <text class="gate-txt c2-txt" x="394.0" y="178.5" text-anchor="middle">T</text>
  <rect class="c2-soft" x="381.5" y="218.0" width="25.0" height="24.0" rx="5"/>
  <text class="gate-txt c2-txt" x="394.0" y="234.5" text-anchor="middle">T†</text>
  <line class="wire" x1="424.8" y1="174.0" x2="424.8" y2="221.0"/>
