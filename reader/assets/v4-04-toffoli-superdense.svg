  <line class="wire" x1="424.8" y1="223.0" x2="424.8" y2="237.0"/>
  <rect class="c2-soft" x="34" y="318" width="224" height="76" rx="8"/>
  <text class="xsb c2-txt" x="46" y="337">无辅助理论下界（本电路）</text>
  <text class="xs" x="46" y="357">6 CNOT + 4 T + 3 T† + 2 H = 15 门</text>
  <text class="xs" x="46" y="377">Shende–Markov / Gosset 严格下界</text>
  <rect class="c3-soft" x="270" y="318" width="224" height="76" rx="8"/>
  <text class="xsb c3-txt" x="282" y="337">借 1 干净辅助位：4-T 临时逻辑与</text>
  <text class="xs" x="282" y="357">正向仅耗 4 个 T 门（Jones/Gidney）</text>
  <text class="xs" x="282" y="377">中段测量 + Clifford 反计算 0 个 T</text>
  <rect class="note" x="34.0" y="404.0" width="460.0" height="30.0" rx="8"/>
  <text class="xsb" x="264.0" y="423.2" text-anchor="middle">两侧 H 将对称 CCZ 转为 CCNOT；赤陶色 T/T† 门主导容错魔法态开销</text>
  <rect class="panel" x="520.0" y="68.0" width="420.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 532.0 69.0 H 928.0 Q 939.0 69.0 939.0 80.0 V 99.0 H 521.0 V 80.0 Q 521.0 69.0 532.0 69.0 Z"/>
  <line class="grid" x1="521.0" y1="99.0" x2="939.0" y2="99.0"/>
