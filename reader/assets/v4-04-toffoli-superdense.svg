  <rect class="bg" width="960" height="460" rx="16"/>
  <text class="title" x="22" y="34">Toffoli 门 6-CNOT / 7-T 标准分解与超密编码 / 隐形传态对偶电路</text>
  <text class="subtitle" x="22" y="54">左：无辅助 Toffoli 门精确 Clifford+T 线路（理论下界）；右：超密编码与隐形传态的镜像对偶结构</text>
  <rect class="panel" x="20.0" y="68.0" width="488.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 32.0 69.0 H 496.0 Q 507.0 69.0 507.0 80.0 V 99.0 H 21.0 V 80.0 Q 21.0 69.0 32.0 69.0 Z"/>
  <line class="grid" x1="21.0" y1="99.0" x2="507.0" y2="99.0"/>
  <text class="sec" x="33.0" y="89.5">1. Toffoli 门标准 Clifford+T 分解（6 CNOT + 7 T/T† + 2 H）</text>
  <rect class="subpanel" x="34" y="109" width="460" height="28" rx="7"/>
  <text class="xsb" x="264" y="127" text-anchor="middle">CCZ 相位多项式：4abc = a + b + c − (a⊕b) − (a⊕c) − (b⊕c) + (a⊕b⊕c)</text>
  <line class="wire" x1="68" y1="174.0" x2="444" y2="174.0"/>
  <text class="smb" x="62" y="178.5" text-anchor="end">|a⟩</text>
  <text class="smb c3-txt" x="450" y="178.5">|a⟩</text>
  <line class="wire" x1="68" y1="230.0" x2="444" y2="230.0"/>
  <text class="smb" x="62" y="234.5" text-anchor="end">|b⟩</text>
  <text class="smb c3-txt" x="450" y="234.5">|b⟩</text>
  <line class="wire" x1="68" y1="286.0" x2="444" y2="286.0"/>
  <text class="smb" x="62" y="290.5" text-anchor="end">|c⟩</text>
  <text class="smb c3-txt" x="450" y="290.5">|c⊕ab⟩</text>
