<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="v2-06-grover-geometry-title v2-06-grover-geometry-desc">
  <title id="v2-06-grover-geometry-title">Grover 振幅放大在 {|B⟩, |G⟩} 平面内的精确几何旋转</title>
  <desc id="v2-06-grover-geometry-desc">取 θ = arcsin(1/4) ≈ 14.48°，精确绘出初态 |s⟩、关于 |B⟩ 反射的 O|s⟩ (-θ) 与再关于 |s⟩ 反射的 𝒬|s⟩ (3θ)，单步净旋 +2θ，并列出 k=0..3 的精确成功率。</desc>
  <style>
    :root{color-scheme:light dark}
    .bg{fill:#f8fafc}
    .card{fill:#ffffff;stroke:#cbd8e4;stroke-width:1.6}
    .subcard{fill:#f2f6fa;stroke:#d2dee9;stroke-width:1.2}
    .pill{fill:#ffffff;fill-opacity:.94;stroke:#8fa6ba;stroke-width:1.2}
    .ink{fill:#13263a}
    .muted{fill:#496176}
    .accent{fill:#0e6b8a}
    .warn{fill:#b93c3c}
    .gold{fill:#9c6510}
    .purple{fill:#5b42a6}
    .green{fill:#1d7557}
    .axis{stroke:#2b465e;stroke-width:1.8;fill:none}
    .axishead{fill:#2b465e}
    .grid{stroke:#d8e3ec;stroke-width:1;stroke-dasharray:4 4;fill:none}
    .divider{stroke:#c6d5e2;stroke-width:1.3;stroke-dasharray:5 5;fill:none}
    .unit-circle{stroke:#5d7890;stroke-width:1.8;stroke-dasharray:6 5;fill:none}
    .region{fill:#bae6fd;fill-opacity:.48;stroke:#0e6b8a;stroke-width:2.4}
    .region-alt{fill:#fde68a;fill-opacity:.44;stroke:#a8640b;stroke-width:2.4}
    .vec-a{stroke:#0e6b8a;stroke-width:2.8;fill:none}
    .vec-a-head{fill:#0e6b8a}
    .vec-b{stroke:#c04040;stroke-width:2.6;stroke-dasharray:8 4;fill:none}
    .vec-b-head{fill:#c04040}
    .vec-c{stroke:#5b42a6;stroke-width:3.0;fill:none}
    .vec-c-head{fill:#5b42a6}
    .wire{stroke:#1d3b54;stroke-width:2.2;fill:none}
    .gate{fill:#e6f4fa;stroke:#0e6b8a;stroke-width:2}
    .gate-alt{fill:#fef3d6;stroke:#a8640b;stroke-width:2}
    .gate-inv{fill:#ede9fe;stroke:#5b42a6;stroke-width:2}
    .node-a{fill:#0e6b8a;stroke:#0a5068;stroke-width:2}
    .node-a-txt{fill:#ffffff}
    .ctrl{fill:#13263a}
    .fixed{fill:#c04040;stroke:#ffffff;stroke-width:1.6}
    .title{font:700 20px 'PingFang SC','Noto Sans SC',system-ui,'STIX Two Math','Cambria Math','Apple Symbols',sans-serif}
    .subtitle{font:400 14px 'PingFang SC','Noto Sans SC',system-ui,'STIX Two Math','Cambria Math','Apple Symbols',sans-serif}
    .h2{font:600 14.5px 'PingFang SC','Noto Sans SC',system-ui,'STIX Two Math','Cambria Math','Apple Symbols',sans-serif}
    .lbl{font:500 13.5px 'PingFang SC','Noto Sans SC',system-ui,'STIX Two Math','Cambria Math','Apple Symbols',sans-serif}
    .sm{font:400 13px 'PingFang SC','Noto Sans SC',system-ui,'STIX Two Math','Cambria Math','Apple Symbols',sans-serif}
    .mono{font:500 12.8px 'SFMono-Regular',Menlo,Consolas,monospace}
    .gate-txt{font:700 15px Georgia,'Times New Roman',serif}
    
    @media(prefers-color-scheme:dark){
      .bg{fill:#101820}
      .card{fill:#162330;stroke:#395066}
      .subcard{fill:#1d2e3d;stroke:#3d566d}
      .pill{fill:#14212c;fill-opacity:.94;stroke:#6d8ba3}
      .ink{fill:#eef6ff}
      .muted{fill:#b4c8da}
      .accent{fill:#6ed0f7}
      .warn{fill:#ff8585}
      .gold{fill:#f2c15a}
      .purple{fill:#c0adff}
      .green{fill:#6dd4aa}
      .axis{stroke:#b9d0e2}
      .axishead{fill:#b9d0e2}
      .grid{stroke:#32485c}
      .divider{stroke:#4a637a}
      .unit-circle{stroke:#8aa5bc}
      .region{fill:#17506e;fill-opacity:.58;stroke:#6ed0f7}
      .region-alt{fill:#5a4318;fill-opacity:.58;stroke:#f2c15a}
      .vec-a{stroke:#6ed0f7}
      .vec-a-head{fill:#6ed0f7}
      .vec-b{stroke:#ff8585}
      .vec-b-head{fill:#ff8585}
      .vec-c{stroke:#c0adff}
      .vec-c-head{fill:#c0adff}
      .wire{stroke:#c9deee}
      .gate{fill:#19425a;stroke:#6ed0f7}
      .gate-alt{fill:#493818;stroke:#f2c15a}
      .gate-inv{fill:#342859;stroke:#c0adff}
      .node-a{fill:#1b5c7a;stroke:#6ed0f7;stroke-width:2.2}
      .node-a-txt{fill:#eef6ff}
      .ctrl{fill:#eef6ff}
      .fixed{fill:#ff8585;stroke:#162330}
      
    }
  </style>
  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title ink" x="38" y="52">Grover / 振幅放大的二维几何旋转：两次反射等价于净旋 2θ</text>
  <text class="subtitle muted" x="38" y="76">二维正交子空间 {|B⟩, |G⟩} 内的单位圆（振幅无量纲），取 θ = arcsin(1/4) ≈ 14.48°（对应初始成功率 a = 1/16）</text>
  <rect class="card" x="36" y="94" width="548" height="426" rx="12"/>
  <text class="h2 ink" x="54" y="120">几何演化图（实线圆点 |s⟩ · 虚线空圈 O|s⟩ · 粗线菱形 𝒬|s⟩）</text>
  <line class="axis" style="stroke-width:1.4" x1="222.0" y1="392.0" x2="222.0" y2="400.0"/>
  <line class="axis" style="stroke-width:1.4" x1="330.0" y1="392.0" x2="330.0" y2="400.0"/>
  <text class="sm muted" x="222.0" y="416.0" text-anchor="middle">0.5</text>
  <text class="sm muted" x="316.0" y="416.0" text-anchor="middle">1.0</text>
  <line class="axis" style="stroke-width:1.4" x1="110.0" y1="288.0" x2="118.0" y2="288.0"/>
  <text class="sm muted" x="104.0" y="292.0" text-anchor="end">0.5</text>
  <line class="axis" style="stroke-width:1.4" x1="110.0" y1="180.0" x2="118.0" y2="180.0"/>
  <text class="sm muted" x="104.0" y="184.0" text-anchor="end">1.0</text>
  <text class="sm muted" x="104.0" y="414.0" text-anchor="end">0</text>
  <line class="axis" x1="94.0" y1="396.0" x2="452.0" y2="396.0"/>
  <path class="axishead" d="M452.00 396.00L443.00 398.75L443.00 393.25Z"/>
  <line class="axis" x1="114.0" y1="494.0" x2="114.0" y2="154.0"/>
  <path class="axishead" d="M114.00 154.00L116.75 163.00L111.25 163.00Z"/>
  <text class="lbl ink" x="126.0" y="166.0">|G⟩（目标态振幅，无量纲）</text>
  <text class="lbl ink" x="350.0" y="416.0">|B⟩（非目标态）</text>
  <path class="unit-circle" d="M306.46 494.06A216.00 216.00 0 0 0 95.17 180.82"/>
  <line class="divider" style="stroke-width:1.6" x1="323.1" y1="342.0" x2="323.1" y2="450.0"/>
  <path class="axis" style="stroke-width:1.2" d="M315.1 396.0V388.0H323.1"/>
  <line class="divider" style="stroke-width:1.6" x1="323.1" y1="450.0" x2="270.9" y2="247.5"/>
  <path class="axis" style="stroke-width:1.2" d="M288.8 350.9L286.6 342.6L294.9 340.5"/>
  <line class="grid" x1="323.1" y1="342.0" x2="348.2" y2="335.5"/>
  <path class="vec-b" style="stroke-width:2.0;stroke-dasharray:5 3" d="M176.00 396.00A62.00 62.00 0 0 1 174.03 411.50"/>
  <text class="sm warn" x="182.0" y="413.0">−θ</text>
  <path class="vec-a" style="stroke-width:2.0" d="M188.00 396.00A74.00 74.00 0 0 0 185.65 377.50"/>
  <text class="sm accent" x="196.0" y="389.0">θ ≈ 14.48°</text>
  <path class="vec-c" style="stroke-width:2.4" d="M222.44 368.00A112.00 112.00 0 0 0 195.33 319.00"/>
  <path class="vec-c-head" d="M195.33 319.00L202.48 323.37L198.72 326.67Z"/>
  <text class="sm purple" style="font-weight:600" x="216.8" y="322.3">净旋 +2θ</text>
  <text class="sm purple" x="216.8" y="342.3">(≈ 28.96°)</text>
  <line class="vec-a" x1="114.0" y1="396.0" x2="323.1" y2="342.0"/>
  <path class="vec-a-head" d="M323.14 342.00L314.21 347.40L312.71 341.60Z"/>
  <circle class="vec-a-head" cx="323.1" cy="342.0" r="4.5"/>
  <line class="vec-b" x1="114.0" y1="396.0" x2="323.1" y2="450.0"/>
  <path class="vec-b-head" d="M323.14 450.00L312.71 450.40L314.21 444.60Z"/>
  <circle style="fill:none;stroke-width:2.2" class="vec-b" cx="323.1" cy="450.0" r="5.5"/>
  <line class="vec-c" x1="114.0" y1="396.0" x2="270.9" y2="247.5"/>
  <path class="vec-c-head" d="M270.86 247.50L265.66 256.55L261.53 252.20Z"/>
  <path class="vec-c-head" d="M270.9 241.5L276.9 247.5L270.9 253.5L264.9 247.5Z"/>
  <text class="lbl accent" x="341.1" y="333.0">初态 |s⟩ (+θ)</text>
  <text class="sm muted" x="341.1" y="354.0">坐标 (0.968, 0.250)</text>
  <text class="lbl warn" x="341.1" y="451.0">O|s⟩ (−θ)</text>
  <text class="sm muted" x="341.1" y="472.0">① 关于 |B⟩ 反射</text>
  <text class="lbl purple" x="284.9" y="236.5">𝒬|s⟩ = DO|s⟩ (3θ ≈ 43.43°)</text>
  <text class="sm muted" x="284.9" y="257.5">② 关于 |s⟩ 反射，⟨G|𝒬|s⟩ = 11/16</text>
  <rect class="card" x="600" y="94" width="364" height="132" rx="12"/>
  <text class="h2 ink" x="616" y="120">两步反射与净旋转矩阵（基序 |B⟩, |G⟩）</text>
  <text class="sm ink" x="616" y="144">① 相位标记：O = S<tspan dy="3" font-size="9.5">G</tspan><tspan dy="-3">&#8203;</tspan> = I − 2Π<tspan dy="3" font-size="9.5">G</tspan><tspan dy="-3">&#8203;</tspan>（平面内关于 |B⟩ 反射）</text>
  <text class="sm ink" x="616" y="168">② 扩散算符：D = 2|s⟩⟨s| − I（关于 |s⟩ 反射）</text>
  <text class="sm purple" x="616" y="192">③ 单步迭代：𝒬 = DO = R(2θ)，净旋 +2θ</text>
  <text class="sm muted" x="616" y="214">注：次序不可换，OD|s⟩ = O|s⟩ 首轮不增概率</text>
  <rect class="card" x="600" y="238" width="364" height="164" rx="12"/>
  <text class="h2 ink" x="616" y="264">逐轮精确演化（sin θ = 1/4, a = M/N = 1/16）</text>
  <line class="divider" x1="614" y1="276" x2="950" y2="276"/>
  <text class="sm muted" x="616" y="294">轮次</text>
  <text class="sm muted" x="664" y="294">角度 (2k+1)θ</text>
  <text class="sm muted" x="764" y="294">目标振幅</text>
  <text class="sm muted" x="836" y="294">成功率 P(G)</text>
  <text class="mono ink" x="616" y="318">k=0</text>
  <text class="mono ink" x="664" y="318">1θ=14.48°</text>
  <text class="mono ink" x="764" y="318">0.2500</text>
  <text class="mono ink" x="836" y="318"> 6.25%</text>
  <text class="mono purple" x="616" y="342">k=1</text>
  <text class="mono purple" x="664" y="342">3θ=43.43°</text>
  <text class="mono purple" x="764" y="342">0.6875</text>
  <text class="mono purple" x="836" y="342">47.27%</text>
  <text class="mono ink" x="616" y="366">k=2</text>
  <text class="mono ink" x="664" y="366">5θ=72.39°</text>
  <text class="mono ink" x="764" y="366">0.9531</text>
  <text class="mono ink" x="836" y="366">90.84%</text>
  <text class="mono green" x="616" y="390">k=3</text>
  <text class="mono green" x="664" y="390">7θ=101.34°</text>
  <text class="mono green" x="764" y="390">0.9805</text>
  <text class="mono green" x="836" y="390">96.13% (最优)</text>
  <rect class="card" x="600" y="414" width="364" height="106" rx="12"/>
  <text class="h2 ink" x="616" y="440">最优步数与过旋警告</text>
  <text class="sm ink" x="616" y="464">k 轮后：𝒬ᵏ|s⟩ = cos((2k+1)θ)|B⟩ + sin((2k+1)θ)|G⟩</text>
  <text class="sm ink" x="616" y="486">最优 k* ≈ (π/4)√(N/M) − 1/2 ≈ 2.64 → 取 k = 3</text>
  <text class="sm warn" x="616" y="508">若继续至 k = 4 (9θ ≈ 130.3°)，P(G) 降至 58.2%</text>
  <text class="sm muted" x="38" y="544">注：横纵轴均为无量纲实振幅分量；向量以实线圆点(|s⟩)、虚线空心圆(O|s⟩)与粗线菱形(𝒬|s⟩)区分，黑白阅读清晰。</text>
</svg>
