  <text class="sm" x="64.0" y="275.9" text-anchor="end">0.04</text>
  <line class="grid" x1="72.0" y1="227.8" x2="468.0" y2="227.8"/>
  <line class="axis" x1="68.0" y1="227.8" x2="72.0" y2="227.8"/>
  <text class="sm" x="64.0" y="231.8" text-anchor="end">0.08</text>
  <line class="grid" x1="72.0" y1="183.7" x2="468.0" y2="183.7"/>
  <line class="axis" x1="68.0" y1="183.7" x2="72.0" y2="183.7"/>
  <text class="sm" x="64.0" y="187.7" text-anchor="end">0.12</text>
  <line class="grid" x1="72.0" y1="139.6" x2="468.0" y2="139.6"/>
  <line class="axis" x1="68.0" y1="139.6" x2="72.0" y2="139.6"/>
  <text class="sm" x="64.0" y="143.6" text-anchor="end">0.16</text>
  <text class="sm" x="68.0" y="106.0" text-anchor="end">P(x)</text>
  <text class="smb" x="270.0" y="351.0" text-anchor="middle">位置格点 x（t = 30 步偶数格点包络）</text>
