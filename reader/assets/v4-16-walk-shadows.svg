  <circle class="c2-fill" cx="270.0" cy="156.7" r="3.6"/>
  <circle class="c1-fill" cx="138.0" cy="154.8" r="3.6"/>
  <circle class="c1-fill" cx="402.0" cy="154.8" r="3.6"/>
  <text class="smb c1-txt" x="76.0" y="126.0">量子双峰 ≈ ±t/√2</text>
  <line class="c1" x1="124.0" y1="132.0" x2="136.0" y2="149.8" stroke-width="1.3"/>
  <text class="smb c2-txt" x="270.0" y="141.0" text-anchor="middle">经典 σ_cl = √t ≈ 5.48</text>
  <line class="c2" x1="270.0" y1="145.0" x2="270.0" y2="151.7" stroke-width="1.3"/>
  <text class="smb c1-txt" x="464.0" y="126.0" text-anchor="end">弹道 σ_Q ≈ 16.25 ∝ t</text>
  <line class="c1" x1="416.0" y1="132.0" x2="404.0" y2="149.8" stroke-width="1.3"/>
  <rect class="subpanel" x="32.0" y="366.0" width="442.0" height="58.0" rx="7.0"/>
  <text class="sm" x="42.0" y="386.0">初态 |x=0⟩⊗(|R⟩+i|L⟩)/√2，每步 W = S(I⊗H) 严格保持酉演化</text>
  <text class="smb c1-txt" x="42.0" y="408.0">实算对比：σ_Q / σ_cl = 2.97×，相干干涉把扩散从 √t 推至弹道 t</text>
  <rect class="panel" x="498.0" y="64.0" width="442.0" height="370.0" rx="10.0"/>
  <rect class="phead" x="499.0" y="65.0" width="440.0" height="28.0" rx="9.0"/>
  <line class="grid" x1="499.0" y1="93.0" x2="939.0" y2="93.0"/>
  <text class="sec" x="510.0" y="84.0">(b) 随机单比特 Clifford 经典影子采样与估计流程</text>
  <rect class="c3-soft" x="510.0" y="102.0" width="418.0" height="50.0" rx="7.0"/>
  <rect class="c3-fill" x="519.0" y="115.0" width="24.0" height="24.0" rx="5.0"/>
  <text class="badge-txt" x="531.0" y="131.5" text-anchor="middle">1</text>
  <text class="smb c3-txt" x="552.0" y="122.0">随机单比特 Clifford 旋转（硬件层）</text>
  <text class="sm" x="552.0" y="141.0">对 n 比特未知态 ρ 逐比特独立抽 U_j ∈ {I, H, HS†}（Z/X/Y 基）</text>
  <line class="axis" x1="719.0" y1="152.0" x2="719.0" y2="166.0" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect class="c1-soft" x="510.0" y="168.0" width="418.0" height="48.0" rx="7.0"/>
  <rect class="c1-fill" x="519.0" y="180.0" width="24.0" height="24.0" rx="5.0"/>
  <text class="badge-txt" x="531.0" y="196.5" text-anchor="middle">2</text>
  <text class="smb c1-txt" x="552.0" y="188.0">计算基单次投影快照（重复 N 轮）</text>
  <text class="sm" x="552.0" y="205.0">测得比特串 b̂^(m) ∈ {0,1}ⁿ，经典存储 {(U^(m), b̂^(m))}_{m=1}^N</text>
  <line class="axis" x1="719.0" y1="216.0" x2="719.0" y2="230.0" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect class="c4-soft" x="510.0" y="232.0" width="418.0" height="54.0" rx="7.0"/>
  <rect class="c4-fill" x="519.0" y="247.0" width="24.0" height="24.0" rx="5.0"/>
  <text class="badge-txt" x="531.0" y="263.5" text-anchor="middle">3</text>
  <text class="smb c4-txt" x="552.0" y="252.0">离线逆通道重构经典影子（经典层）</text>
  <text class="sm" x="552.0" y="275.0">ρ̂^(m) = ⊗_j (3 U_j† |b̂_j⟩⟨b̂_j| U_j − I)，无偏满足 E[ρ̂] = ρ</text>
  <line class="axis" x1="719.0" y1="286.0" x2="719.0" y2="300.0" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect class="c5-soft" x="510.0" y="302.0" width="418.0" height="54.0" rx="7.0"/>
  <rect class="c5-fill" x="519.0" y="317.0" width="24.0" height="24.0" rx="5.0"/>
  <text class="badge-txt" x="531.0" y="333.5" text-anchor="middle">4</text>
  <text class="smb c5-txt" x="552.0" y="322.0">中位数均值估计 M 个局域观测量 {O_i}</text>
  <text class="sm" x="552.0" y="345.0">ô_i = median_k Tr(O_i ρ̂̄_k) ｜ N = O(log(M/δ) · 3^w / ε²)</text>
  <rect class="note" x="510.0" y="368.0" width="418.0" height="56.0" rx="7.0"/>
  <text class="smb" x="520.0" y="388.0">核心优势：先采样、后提问，样本数仅按 log M 缓慢增长</text>
  <text class="sm" x="520.0" y="409.0">适用边界：单比特随机 Pauli 影子方差按 3^w 增长（限于低权重 w）</text>
  <text class="sm" x="22.0" y="450.0">数学验证：第 16 章 §4.3、§8.3；t=30 偶数格点实算 ∑P_cl = ∑P_Q = 1.0000，量子行走标准差相对经典放大近 3 倍。</text>
</svg>
