<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">一维量子行走双峰弹道扩散与经典影子随机测量流程</title>
  <desc id="desc">左面板实算 t=30 步一维经典随机游走高斯分布（σ_cl=5.48=√t）与对称初态 1D Hadamard 量子行走双峰弹道扩散（σ_Q=16.25∝t，双峰位于 ±t/√2 附近）；右面板展示随机单比特 Clifford 经典影子（Classical Shadows）四步流程：随机单比特旋转、计算基快照采样、离线逆通道重构及中位数均值估计 M 个局域观测量。</desc>
  <style>
:root{color-scheme:light}
text{font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.bg{fill:#FAF8F3}
