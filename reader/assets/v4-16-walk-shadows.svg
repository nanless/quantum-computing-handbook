  <line class="axis" x1="270.0" y1="316.0" x2="270.0" y2="320.0"/>
  <text class="sm" x="270.0" y="333.0" text-anchor="middle">0</text>
  <line class="grid" x1="336.0" y1="112.0" x2="336.0" y2="316.0"/>
  <line class="axis" x1="336.0" y1="316.0" x2="336.0" y2="320.0"/>
  <text class="sm" x="336.0" y="333.0" text-anchor="middle">10</text>
  <line class="grid" x1="402.0" y1="112.0" x2="402.0" y2="316.0"/>
  <line class="axis" x1="402.0" y1="316.0" x2="402.0" y2="320.0"/>
  <text class="sm" x="402.0" y="333.0" text-anchor="middle">20</text>
  <line class="grid" x1="468.0" y1="112.0" x2="468.0" y2="316.0"/>
  <line class="axis" x1="468.0" y1="316.0" x2="468.0" y2="320.0"/>
  <text class="sm" x="468.0" y="333.0" text-anchor="middle">30</text>
  <line class="grid" x1="72.0" y1="316.0" x2="468.0" y2="316.0"/>
