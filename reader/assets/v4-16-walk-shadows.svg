  <line class="axis" x1="72.0" y1="112.0" x2="72.0" y2="316.0"/>
  <line class="axis" x1="72.0" y1="316.0" x2="468.0" y2="316.0"/>
  <polyline class="c2" points="72.00,316.00 85.20,316.00 98.40,316.00 111.60,316.00 124.80,315.97 138.00,315.85 151.20,315.39 164.40,313.91 177.60,309.99 190.80,301.31 204.00,285.14 217.20,259.90 230.40,227.17 243.60,193.01 256.80,166.65 270.00,156.70 283.20,166.65 296.40,193.01 309.60,227.17 322.80,259.90 336.00,285.14 349.20,301.31 362.40,309.99 375.60,313.91 388.80,315.39 402.00,315.85 415.20,315.97 428.40,316.00 441.60,316.00 454.80,316.00 468.00,316.00" stroke-width="2.0" stroke-dasharray="6 3.5"/>
