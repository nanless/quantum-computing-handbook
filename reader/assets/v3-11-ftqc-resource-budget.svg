<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="v3-11-ftqc-resource-budget-title v3-11-ftqc-resource-budget-desc">
  <title id="v3-11-ftqc-resource-budget-title">表面码指数压错与 RSA-2048 容错资源演进分解</title>
  <desc id="v3-11-ftqc-resource-budget-desc">左面板绘出表面码逻辑错率随码距 d=3..31 的指数压制曲线并标注 Willow 实测与 10^-10 门槛；右面板线性对比 Gidney-Ekera 2021 的 2000 万物理比特与 Gidney 2025 的 897,864 物理比特并放大拆解冷存储、热存储与计算培育三区占比。</desc>
