<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">一维矩形方势垒透射率：连续势垒顶与高能干涉共振</title>
  <desc id="desc">宽度参数 g = L√(2mV₀)/ℏ = 4 的一维矩形方势垒精确透射率 T(e)（e = E/V₀，两侧势能与质量相等）：e &lt; 1 为指数衰减隧穿区，e = 1 势垒顶处严格连续且 T(1) = 1/5 = 0.20（80% 被反射），e &gt; 1 为内部振荡干涉区，在 e₁ = 1 + π²/16 ≈ 1.61685 与 e₂ = 1 + π²/4 ≈ 3.46740 处达到完全透明 T = 1。</desc>
