  <rect class="pill" x="44" y="502" width="606" height="34" rx="8"/>
  <text class="sm" x="347" y="523" text-anchor="middle">低于势垒顶为衰减隧穿；高于势垒顶为内部振荡波，势垒宽装下整数半波长时边界反射相消</text>
  <rect class="c2-soft" x="696" y="144" width="262" height="86" rx="10"/>
  <text class="smb c2-txt" x="710" y="164">能区 I：0 &lt; e &lt; 1（指数隧穿）</text>
  <text class="sm" x="710" y="185">衰减相位 κL = g√(1−e)</text>
  <text class="sm" x="710" y="205">T = [1 + sinh²(κL)/(4e(1−e))]⁻¹</text>
  <text class="xs" x="710" y="222">势垒内增长与衰减两支指数缺一不可</text>
  <rect class="c4-soft" x="696" y="238" width="262" height="74" rx="10"/>
  <text class="smb c4-txt" x="710" y="258">能区 II：e = 1（临界线性解）</text>
  <text class="sm" x="710" y="280">T(1) = 1 / (1 + g²/4) = 1/5 = 0.20</text>
  <text class="xs" x="710" y="300">左右极限严格连续，恒满足 T(1) &lt; 1</text>
  <rect class="c3-soft" x="696" y="320" width="262" height="90" rx="10"/>
  <text class="smb c3-txt" x="710" y="340">能区 III：e &gt; 1（边界干涉共振）</text>
  <text class="sm" x="710" y="361">振荡相位 qL = g√(e−1)</text>
  <text class="sm" x="710" y="381">T = [1 + sin²(qL)/(4e(e−1))]⁻¹</text>
  <text class="xs" x="710" y="400">qL = ℓπ ⇒ e<tspan dy="3" font-size="75%">ℓ</tspan><tspan dy="-3">&#8203;</tspan> = 1 + (ℓπ/g)² 处 T = 1</text>
  <rect class="pill" x="696" y="418" width="262" height="118" rx="10"/>
  <text class="smb" x="710" y="438">关键特征点核验（R + T = 1）</text>
  <text class="sm" x="710" y="460">• e = 0.50：T = 0.0139，R = 0.9861</text>
  <text class="sm" x="710" y="481">• e = 1.00：T = 0.2000，R = 0.8000</text>
  <text class="sm c3-txt" x="710" y="502">• e₁ = 1.61685：T = 1.0000（ℓ = 1）</text>
  <text class="sm c3-txt" x="710" y="523">• e₂ = 3.46740：T = 1.0000（ℓ = 2）</text>
</svg>
