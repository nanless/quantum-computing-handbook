<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">二元香农熵、Helstrom 最优测量轴与 Holevo 界对比</title>
  <desc id="desc">左面板精确绘制二元香农熵 H₂(p) = −p log₂p − (1−p)log₂(1−p) 在 p ∈ [0, 1] 的凹曲线，标出 p = 0.5 处最大值 1.00 bit 及 p_e ≈ 0.146 处 H₂(p_e) ≈ 0.601 bit。右面板上部在 Bloch x-z 截面标出等先验态 |0⟩ 与 |+⟩（Bloch 夹角 90°）以及最优 Helstrom 测量轴（Bloch 偏转 45°，对应态空间夹角 θ/2 = 22.5°，成功率 cos²22.5° = 85.36%）；下部柱状图对比 Holevo 上界 χ = 0.601 bit 与单次可访问信息 I_acc = 0.399 bit。</desc>
