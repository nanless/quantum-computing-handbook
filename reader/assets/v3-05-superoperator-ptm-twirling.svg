  <text class="xs" x="254" y="502" text-anchor="middle">R<tspan dy="3" font-size="74%">ij</tspan><tspan dy="-3">&#8203;</tspan> = ½Tr(σ<tspan dy="3" font-size="74%">i</tspan><tspan dy="-3">&#8203;</tspan> E(σ<tspan dy="3" font-size="74%">j</tspan><tspan dy="-3">&#8203;</tspan>)) = (M† S<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan> M)<tspan dy="3" font-size="74%">ij</tspan><tspan dy="-3">&#8203;</tspan></text>
