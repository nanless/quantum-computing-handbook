<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">超算符五表示互转与 Pauli 旋转随机化 PTM 热力矩阵对照</title>
  <desc id="desc">左面板展示 Stinespring 扩张、Kraus 算符和、Choi 矩阵、Liouville 超算符与 Pauli 转移矩阵 (PTM) 五种等价量子信道表示的精确转换关系。右面板以 4×4 PTM 热力矩阵对照相干过旋转 Rz(0.2) 在 Pauli 旋转随机化前后的单步元素变化：非对角元归零，主对角线与平均门保真度不变。10 层独立刷新时错误概率为 9.12%，复用同一随机符号时为 70.81%。</desc>
