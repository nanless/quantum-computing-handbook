  <text class="sec" x="512" y="117">Rz(0.2) 经 Pauli 旋转随机化前后 4×4 PTM 热力矩阵</text>
  <rect class="c5-soft" x="132" y="144" width="244" height="64" rx="9"/>
  <text class="smb c5-txt" x="254" y="164" text-anchor="middle">① Stinespring 扩张</text>
  <text class="xs" x="254" y="182" text-anchor="middle">Tr<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan>[ U (ρ ⊗ |0⟩⟨0|<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan>) U† ]</text>
  <text class="xs c5-txt" x="254" y="199" text-anchor="middle">自动满足 CP+TP · 微观物理图像</text>
  <line class="axis" stroke-width="1.6" x1="254" y1="210" x2="254" y2="246"/>
  <polygon class="axis-fill" points="254,210 256.53,215.5 251.47,215.5"/>
  <polygon class="axis-fill" points="254,246 251.47,240.5 256.53,240.5"/>
  <text class="xs" x="242" y="232" text-anchor="end">K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan> = <tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan>⟨k|U|0⟩<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan></text>
  <text class="xs" x="266" y="232">V = ∑ K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan> ⊗ |k⟩<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan></text>
  <rect class="c1-soft" x="132" y="249" width="244" height="64" rx="9"/>
  <text class="smb c1-txt" x="254" y="269" text-anchor="middle">② Kraus 算符和 {Kₖ}</text>
  <text class="xs" x="254" y="287" text-anchor="middle">E(ρ) = ∑ K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan> ρ K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan>†，∑ K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan>†K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan> = I</text>
  <text class="xs c1-txt" x="254" y="304" text-anchor="middle">极易判 TP · 适配量子跳跃轨迹</text>
  <rect class="c3-soft" x="42" y="354" width="184" height="68" rx="9"/>
  <text class="smb c3-txt" x="134" y="375" text-anchor="middle">③ Choi 矩阵 J<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan></text>
  <text class="xs" x="134" y="394" text-anchor="middle">∑ vec(K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan>) vec(K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan>)†</text>
  <text class="xs c3-txt" x="134" y="413" text-anchor="middle">最易判 CP：J<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan> ⪰ 0</text>
  <rect class="c4-soft" x="282" y="354" width="184" height="68" rx="9"/>
  <text class="smb c4-txt" x="374" y="375" text-anchor="middle">④ Liouville 超算符 S<tspan dy="3" font-size="74%">E</tspan><tspan dy="-3">&#8203;</tspan></text>
  <text class="xs" x="374" y="394" text-anchor="middle">∑ K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan>* ⊗ K<tspan dy="3" font-size="74%">k</tspan><tspan dy="-3">&#8203;</tspan> (列堆叠)</text>
  <text class="xs c4-txt" x="374" y="413" text-anchor="middle">串联即矩阵乘 S<tspan dy="3" font-size="74%">2</tspan><tspan dy="-3">&#8203;</tspan>S<tspan dy="3" font-size="74%">1</tspan><tspan dy="-3">&#8203;</tspan></text>
