  <text class="title" x="34" y="52">超算符五种等价表示互转与 Pauli 旋转随机化 PTM 对照</text>
  <text class="subtitle" x="34" y="76">左：Stinespring ↔ Kraus ↔ Choi ↔ Liouville ↔ PTM 转换网络；右：Rz(0.2) 随机化后非对角相干元 ∓0.199 归零</text>
