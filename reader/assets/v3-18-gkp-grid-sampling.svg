  <text class="title" x="32" y="52">GKP 相空间网格稳定子与量子采样复杂度反证链</text>
  <text class="subtitle" x="32" y="77">左：[q, p] = i 方形 GKP 晶格、稳定子位移与 Voronoi 纠错域；右：采样优越性四步反证链与噪声边界</text>
