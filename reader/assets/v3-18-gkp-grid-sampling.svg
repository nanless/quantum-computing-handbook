  <text class="xs" x="320" y="428.8" text-anchor="middle">√π</text>
  <text class="xs" x="132.1" y="243.5" text-anchor="end">√π</text>
  <line class="grid" x1="374" y1="169.8" x2="374" y2="412.8"/>
  <line class="grid" x1="139.1" y1="186" x2="398.3" y2="186"/>
  <text class="xs" x="374" y="428.8" text-anchor="middle">2√π</text>
  <text class="xs" x="132.1" y="189.5" text-anchor="end">2√π</text>
  <rect class="area1" x="266" y="186" width="108" height="108"/>
  <rect class="c1" stroke-width="1.5" stroke-dasharray="5 4" x="266" y="186" width="108" height="108"/>
  <rect class="c3-soft" x="239" y="267" width="54" height="54"/>
  <rect fill="url(#hatch-green)" x="239" y="267" width="54" height="54"/>
  <line class="axis" x1="139.1" y1="412.8" x2="408.3" y2="412.8"/>
  <polygon class="axis-fill" points="408.3,412.8 401.3,416.16 401.3,409.44"/>
  <line class="axis" x1="139.1" y1="412.8" x2="139.1" y2="159.8"/>
  <polygon class="axis-fill" points="139.1,159.8 142.46,166.8 135.74,166.8"/>
  <text class="sm" x="268.7" y="446.8" text-anchor="middle">位置正交分量 q（单位：√π）</text>
  <text class="sm" x="54" y="291.3" text-anchor="middle" transform="rotate(-90 54 291.3)">动量正交分量 p（单位：√π）</text>
