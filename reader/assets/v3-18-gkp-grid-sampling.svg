  <polygon class="c2-fill" points="212,342.6 217.4,348 212,353.4 206.6,348"/>
  <polygon class="c2-fill" points="212,288.6 217.4,294 212,299.4 206.6,294"/>
  <polygon class="c2-fill" points="212,234.6 217.4,240 212,245.4 206.6,240"/>
  <polygon class="c2-fill" points="212,180.6 217.4,186 212,191.4 206.6,186"/>
  <circle class="c1-fill" cx="266" cy="402" r="4.8"/>
  <circle class="c1-fill" cx="266" cy="348" r="4.8"/>
  <circle class="c1-fill" cx="266" cy="294" r="4.8"/>
  <circle class="c1-fill" cx="266" cy="240" r="4.8"/>
  <circle class="c1-fill" cx="266" cy="186" r="4.8"/>
  <polygon class="c2-fill" points="320,396.6 325.4,402 320,407.4 314.6,402"/>
  <polygon class="c2-fill" points="320,342.6 325.4,348 320,353.4 314.6,348"/>
  <polygon class="c2-fill" points="320,288.6 325.4,294 320,299.4 314.6,294"/>
  <polygon class="c2-fill" points="320,234.6 325.4,240 320,245.4 314.6,240"/>
  <polygon class="c2-fill" points="320,180.6 325.4,186 320,191.4 314.6,186"/>
  <circle class="c1-fill" cx="374" cy="402" r="4.8"/>
  <circle class="c1-fill" cx="374" cy="348" r="4.8"/>
  <circle class="c1-fill" cx="374" cy="294" r="4.8"/>
  <circle class="c1-fill" cx="374" cy="240" r="4.8"/>
  <circle class="c1-fill" cx="374" cy="186" r="4.8"/>
  <text class="xsb c1-txt" x="320" y="209.76" text-anchor="middle">晶胞面积 4π</text>
  <text class="xs c1-txt" x="320" y="225.96" text-anchor="middle">= 2×2πℏ (1 比特)</text>
  <text class="xsb c1-txt" x="337.28" y="312.36" text-anchor="middle">S<tspan dy="2.8" font-size="74%">p</tspan><tspan dy="-2.8">&#8203;</tspan> (移 2√π)</text>
  <text class="xsb c1-txt" x="258.44" y="214.08" text-anchor="end">S<tspan dy="2.8" font-size="74%">q</tspan><tspan dy="-2.8">&#8203;</tspan> (移 2√π)</text>
  <text class="xsb c2-txt" x="185" y="333.96" text-anchor="middle">X̄ (√π)</text>
  <text class="xsb c2-txt" x="166.64" y="267">Z̄ (√π)</text>
  <text class="xsb c3-txt" x="317.3" y="370.68" text-anchor="middle">Voronoi 纠错域</text>
  <text class="xs c3-txt" x="317.3" y="386.88" text-anchor="middle">|δq|, |δp| &lt; √π/2 ≈ 0.886</text>
  <line class="c3" stroke-width="1.2" x1="286.52" y1="321" x2="306.5" y2="358.8"/>
  <circle class="c1-fill" cx="62" cy="151" r="4.5"/>
  <text class="xs" x="72" y="155">|0<tspan dy="2.8" font-size="74%">L</tspan><tspan dy="-2.8">&#8203;</tspan>⟩ (q = 2s√π)</text>
  <polygon class="c2-fill" points="182,145.8 187.2,151 182,156.2 176.8,151"/>
  <text class="xs" x="192" y="155">|1<tspan dy="2.8" font-size="74%">L</tspan><tspan dy="-2.8">&#8203;</tspan>⟩ (q = (2s+1)√π)</text>
  <rect class="c3-soft" x="330" y="145" width="14" height="12" rx="2"/>
  <text class="xs" x="350" y="155">Voronoi 可纠错窗</text>
  <rect class="pill" x="44" y="458" width="424" height="80" rx="10"/>
  <text class="xsb" x="58" y="479">Weyl-BCH 三组对易相因子（严禁混写 4πi / 2πi / πi）：</text>
  <text class="xs" x="58" y="501">• 稳定子对易：[S<tspan dy="2.8" font-size="74%">q</tspan><tspan dy="-2.8">&#8203;</tspan>, S<tspan dy="2.8" font-size="74%">p</tspan><tspan dy="-2.8">&#8203;</tspan>] = 0（e<tspan dy="-4" font-size="72%">4πi</tspan><tspan dy="4">&#8203;</tspan>=1）；逻辑保子空间：[Z̄, S<tspan dy="2.8" font-size="74%">p</tspan><tspan dy="-2.8">&#8203;</tspan>] = 0（e<tspan dy="-4" font-size="72%">2πi</tspan><tspan dy="4">&#8203;</tspan>=1）</text>
  <text class="xs c2-txt" x="58" y="523">• 逻辑反对易：Z̄ X̄ = e<tspan dy="-4" font-size="72%">iπ</tspan><tspan dy="4">&#8203;</tspan> X̄ Z̄ = −X̄ Z̄（连续相空间切出离散 Pauli 代数）</text>
  <rect class="c1-soft" x="516" y="148" width="440" height="58" rx="10"/>
  <circle class="c1-fill" cx="538" cy="170" r="11"/>
  <text class="badge-txt" x="538" y="174" text-anchor="middle">1</text>
  <text class="smb" x="558" y="172">假设存在经典多项式近似采样器</text>
  <text class="xs" x="558" y="193">对 BosonSampling（积和式）/ IQP / RCS 输出分布，以总变差距离 ε 采样</text>
  <line class="axis" x1="600" y1="207" x2="600" y2="225"/>
  <polygon class="axis-fill" points="600,226 597.12,220 602.88,220"/>
  <text class="xsb" x="614" y="220">Stockmeyer 近似计数定理</text>
  <rect class="c3-soft" x="516" y="228" width="440" height="58" rx="10"/>
  <circle class="c3-fill" cx="538" cy="250" r="11"/>
  <text class="badge-txt" x="538" y="254" text-anchor="middle">2</text>
  <text class="smb" x="558" y="252">Stockmeyer 计数落入 BPP<tspan dy="-4" font-size="72%">NP</tspan><tspan dy="4">&#8203;</tspan>（PH 第 3 层）</text>
  <text class="xs" x="558" y="273">借隐匿性将单串输出概率 p<tspan dy="2.8" font-size="74%">x</tspan><tspan dy="-2.8">&#8203;</tspan> 估计至平均加性误差 O(ε / 2<tspan dy="-4" font-size="72%">n</tspan><tspan dy="4">&#8203;</tspan>)</text>
  <line class="axis" x1="600" y1="287" x2="600" y2="305"/>
  <polygon class="axis-fill" points="600,306 597.12,300 602.88,300"/>
  <text class="xsb" x="614" y="300">反集中性（Anti-concentration）</text>
  <rect class="note" x="516" y="308" width="440" height="58" rx="10"/>
  <circle class="c4-fill" cx="538" cy="330" r="11"/>
  <text class="badge-txt" x="538" y="334" text-anchor="middle">3</text>
  <text class="smb" x="558" y="332">反集中 + 平均情形 #P-难猜想（PGC / RCS）</text>
  <text class="xs" x="558" y="353">多数串满足 p<tspan dy="2.8" font-size="74%">x</tspan><tspan dy="-2.8">&#8203;</tspan> ≥ Ω(2<tspan dy="-4" font-size="72%">−n</tspan><tspan dy="4">&#8203;</tspan>) ⇒ 加性误差转为乘性相对误差，攻破 #P-难</text>
  <line class="axis" x1="600" y1="367" x2="600" y2="385"/>
  <polygon class="axis-fill" points="600,386 597.12,380 602.88,380"/>
  <text class="xsb" x="614" y="380">Toda 定理（PH ⊆ P<tspan dy="-4" font-size="72%">#P</tspan><tspan dy="4">&#8203;</tspan>）</text>
  <rect class="c2-soft" x="516" y="388" width="440" height="58" rx="10"/>
  <circle class="c2-fill" cx="538" cy="410" r="11"/>
  <text class="badge-txt" x="538" y="414" text-anchor="middle">4</text>
  <text class="smb" x="558" y="412">矛盾：整座多项式谱系 PH 坍塌至第 3 层！</text>
  <text class="xs" x="558" y="433">被复杂度理论视为极不可能 ⇒ 无噪理想采样不存在经典多项式算法</text>
  <rect class="pill" x="516" y="466" width="440" height="74" rx="10"/>
  <text class="smb c2-txt" x="528" y="487">物理边界：恒定门噪声斩断第 ③ 步（Aharonov 等, STOC 2023）</text>
  <text class="xs" x="528" y="508">• 恒定门噪声抹平 Porter–Thomas 散斑涨落与 #P 难干涉信号（分布坍向均匀态）</text>
  <text class="xs" x="528" y="528">• 均匀态仍平凡满足反集中，被摧毁的是 #P 难性；含噪 RCS 具经典多项式算法</text>
</svg>
