<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">GKP 相空间网格稳定子与量子采样复杂度反证链</title>
  <desc id="desc">左面板在 [q̂, p̂] = i（ℏ = 1）相空间精确绘制方形 GKP 晶格：逻辑 |0_L⟩ 位于 q = 2s√π（蓝圆），|1_L⟩ 位于 q = (2s+1)√π（红菱），稳定子平移 S_p, S_q 步长 2√π 围出面积 4π = 2×2πℏ 的单逻辑比特晶胞，原点周围标出可纠错 Voronoi 域 [−√π/2, √π/2]²。右面板展示 BosonSampling/IQP/RCS 经 Stockmeyer 计数与反集中推向 PH 坍塌的反证链，并标出恒定门噪声抹平 Porter–Thomas 散斑涨落与 #P 难干涉信号（分布坍向均匀态）的经典边界。</desc>
