  <text class="sm muted" x="540" y="379">∑ β<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>|0⟩|0⟩<tspan dy="-5" font-size="9.5">⊗t</tspan><tspan dy="5">&#8203;</tspan>|u<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>⟩  →  ∑ β<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>|0⟩|<tspan font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">λ̃</tspan><tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>⟩|u<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>⟩</text>
  <rect class="subcard" x="518" y="394" width="432" height="52" rx="8"/>
  <rect class="gate-alt" x="526" y="404" width="6" height="32" rx="3"/>
  <text class="lbl ink" x="540" y="413">② 受控 R<tspan dy="3" font-size="9.5">y</tspan><tspan dy="-3">&#8203;</tspan> 编码倒数</text>
  <text class="sm muted" x="540" y="437">θ<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan> = 2 arcsin(C/λ<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>)，辅助位 |1⟩ 振幅写入 C/λ<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan></text>
  <rect class="subcard" x="518" y="452" width="432" height="52" rx="8"/>
  <rect class="gate-inv" x="526" y="462" width="6" height="32" rx="3"/>
  <text class="lbl ink" x="540" y="471">③ 逆 QPE 反计算并后选择</text>
  <text class="sm muted" x="540" y="495">相位位归 |0⟩<tspan dy="-5" font-size="9.5">⊗t</tspan><tspan dy="5">&#8203;</tspan> 解除纠缠；测得辅助=1 得 |x⟩ ∝ ∑(β<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>/λ<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>)|u<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>⟩</text>
  <text class="sm muted" x="38" y="541">注：左图 Q=16 仅作整除教学示意（实用需 Q ≥ N² 并配连分数）；右图 0 &lt; C ≤ min|λ<tspan dy="3" font-size="9.5">j</tspan><tspan dy="-3">&#8203;</tspan>|，输出为量子解态而非经典全向量清单。</text>
</svg>
