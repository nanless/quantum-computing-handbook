  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title" x="34" y="52">复振幅干涉叠加与经典态矢量内存指数标度</text>
  <text class="subtitle" x="34" y="76">左：经典非负概率恒增不消 vs 量子复振幅同向相长、反向抵消；右：稠密态矢量与密度矩阵随比特数 n 对数飙升</text>
  <rect class="panel" x="28" y="94" width="452" height="458" rx="14"/>
  <path class="phead" d="M 42 95 H 466 Q 479 95 479 108 V 130 H 29 V 108 Q 29 95 42 95 Z"/>
  <line class="grid" x1="29" y1="130" x2="479" y2="130"/>
  <text class="sec" x="44" y="117">复振幅干涉：相长增强 vs 反向抵消</text>
  <rect class="panel" x="496" y="94" width="476" height="458" rx="14"/>
  <path class="phead" d="M 510 95 H 958 Q 971 95 971 108 V 130 H 497 V 108 Q 497 95 510 95 Z"/>
  <line class="grid" x1="497" y1="130" x2="971" y2="130"/>
  <text class="sec" x="512" y="117">经典稠密模拟内存（16 字节/双精度复数）</text>
  <rect class="c4-soft" x="42" y="144" width="424" height="108" rx="11"/>
  <rect class="c4-fill" x="54" y="155" width="70" height="21" rx="10"/>
  <text class="badge-txt" x="89" y="169" text-anchor="middle">经典概率</text>
  <text class="lblb c4-txt" x="134" y="170">非负相加：p<tspan dy="3" font-size="74%">1</tspan><tspan dy="-3">&#8203;</tspan> + p<tspan dy="3" font-size="74%">2</tspan><tspan dy="-3">&#8203;</tspan> = 1/2 + 1/2 = 1</text>
  <rect class="c4-fill" fill-opacity="0.72" x="58" y="191" width="84" height="22" rx="4"/>
  <text class="badge-txt" x="100" y="206" text-anchor="middle">1/2</text>
  <text class="lblb" x="154" y="207" text-anchor="middle">+</text>
  <rect class="c4-fill" fill-opacity="0.72" x="166" y="191" width="84" height="22" rx="4"/>
  <text class="badge-txt" x="208" y="206" text-anchor="middle">1/2</text>
  <text class="lblb" x="263" y="207" text-anchor="middle">=</text>
  <rect class="c4-fill" x="278" y="191" width="168" height="22" rx="4"/>
  <text class="badge-txt" x="362" y="206" text-anchor="middle">P = 1（恒增不消）</text>
  <text class="sm" x="58" y="238">经典概率恒满足 p ≥ 0，多条互斥路径只能越加越大</text>
  <rect class="c1-soft" x="42" y="264" width="424" height="110" rx="11"/>
  <rect class="c1-fill" x="54" y="275" width="70" height="21" rx="10"/>
  <text class="badge-txt" x="89" y="289" text-anchor="middle">相长干涉</text>
  <text class="lblb c1-txt" x="134" y="290">H|+⟩ → |0⟩：两路径同向相加 (Δφ = 0)</text>
  <line class="c1" stroke-width="3.0" x1="58" y1="324" x2="112" y2="324"/>
  <polygon class="c1-fill" points="116,324 108.5,327.45 108.5,320.55"/>
  <text class="xs c1-txt" x="86" y="313" text-anchor="middle">+1/2</text>
  <text class="lblb" x="130" y="329" text-anchor="middle">+</text>
  <line class="c1" stroke-width="3.0" x1="144" y1="324" x2="198" y2="324"/>
  <polygon class="c1-fill" points="202,324 194.5,327.45 194.5,320.55"/>
  <text class="xs c1-txt" x="172" y="313" text-anchor="middle">+1/2</text>
  <text class="lblb" x="216" y="329" text-anchor="middle">=</text>
  <line class="c1" stroke-width="3.4" x1="230" y1="324" x2="322" y2="324"/>
  <polygon class="c1-fill" points="328,324 319.5,327.91 319.5,320.09"/>
  <text class="xsb c1-txt" x="278" y="313" text-anchor="middle">合振幅 +1</text>
  <rect class="pill-bg" x="342" y="309" width="112" height="28" rx="8"/>
  <text class="smb c1-txt" x="398" y="327" text-anchor="middle">P(0) = |1|<tspan dy="-4.5" font-size="74%">2</tspan><tspan dy="4.5">&#8203;</tspan> = 1</text>
  <text class="sm" x="58" y="361">单步各含 1/√2 因子 ⇒ |1/2 + 1/2|<tspan dy="-4.5" font-size="74%">2</tspan><tspan dy="4.5">&#8203;</tspan> = 1（概率全部集中到 |0⟩）</text>
