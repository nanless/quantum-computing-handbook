  <text class="lblb c2-txt" x="134" y="412">H|+⟩ → |1⟩：两路径反向抵消 (Δφ = π)</text>
  <line class="c1" stroke-width="3.0" x1="58" y1="446" x2="112" y2="446"/>
  <polygon class="c1-fill" points="116,446 108.5,449.45 108.5,442.55"/>
  <text class="xs c1-txt" x="86" y="435" text-anchor="middle">+1/2</text>
  <text class="lblb" x="130" y="451" text-anchor="middle">+</text>
  <line class="c2" stroke-width="3.0" stroke-dasharray="6 3" x1="202" y1="446" x2="148" y2="446"/>
  <polygon class="c2-fill" points="144,446 151.5,442.55 151.5,449.45"/>
  <text class="xs c2-txt" x="174" y="435" text-anchor="middle">−1/2</text>
  <text class="lblb" x="216" y="451" text-anchor="middle">=</text>
  <circle class="c2-fill" cx="278" cy="446" r="5.5"/>
  <text class="xsb c2-txt" x="278" y="433" text-anchor="middle">合振幅 0</text>
  <rect class="pill-bg" x="342" y="431" width="112" height="28" rx="8"/>
  <text class="smb c2-txt" x="398" y="449" text-anchor="middle">P(1) = |0|<tspan dy="-4.5" font-size="74%">2</tspan><tspan dy="4.5">&#8203;</tspan> = 0</text>
  <text class="sm" x="58" y="483">反向复振幅精确抵消 ⇒ |1/2 − 1/2|<tspan dy="-4.5" font-size="74%">2</tspan><tspan dy="4.5">&#8203;</tspan> = 0（量子加速根基）</text>
  <rect class="note" x="42" y="508" width="424" height="32" rx="8"/>
  <text class="xs" x="254" y="528" text-anchor="middle">合并公式：| (1/√2)·(1/√2 ± 1/√2) |<tspan dy="-4.5" font-size="74%">2</tspan><tspan dy="4.5">&#8203;</tspan> = |1/2 ± 1/2|<tspan dy="-4.5" font-size="74%">2</tspan><tspan dy="4.5">&#8203;</tspan> ∈ {0, 1}</text>
  <line class="grid" x1="574" y1="456" x2="948" y2="456"/>
