<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">复振幅干涉叠加与经典态矢量内存指数标度</title>
  <desc id="desc">左面板对照经典非负概率相加（1/2 + 1/2 = 1，恒增不消）与 H|+⟩ 门中两条路径复振幅的同向相长（|1/2 + 1/2|² = 1）和反向相消（|1/2 − 1/2|² = 0）；右面板在对数纵轴上绘出 n = 10 至 50 时稠密态矢量内存 M_ket = 16·2^n B 与稠密密度矩阵内存 M_ρ = 16·4^n B，并标出笔记本 16 GiB (n=30) 与超算 10 PB (10¹⁶ B，n=49 对应 8 PiB ≈ 9.0 PB) 两条容量红线。</desc>
