  <rect class="bg" width="960" height="460" rx="16"/>
  <text class="title" x="22" y="34">量子化学费米子映射权重与双因子化 / THC 块编码压缩</text>
  <text class="subtitle" x="22" y="54">左：Jordan–Wigner 链式 O(N) vs Bravyi–Kitaev Fenwick 树 O(log₂ N)；右：四指标积分由 O(N⁴) 压至 THC 的 Õ(N)</text>
  <rect class="panel" x="20.0" y="68.0" width="444.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 32.0 69.0 H 452.0 Q 463.0 69.0 463.0 80.0 V 99.0 H 21.0 V 80.0 Q 21.0 69.0 32.0 69.0 Z"/>
  <line class="grid" x1="21.0" y1="99.0" x2="463.0" y2="99.0"/>
  <text class="sec" x="33.0" y="89.5">1. 费米子映射权重：JW O(N) vs BK O(log₂ N)</text>
  <rect class="subpanel" x="34" y="108" width="416" height="86" rx="9"/>
  <text class="xsb c2-txt" x="46" y="126">Jordan–Wigner 链式（a₇† 权重 = N = 8）：串联全部前缀 Z</text>
  <line class="c2" stroke-width="2.2" x1="60" y1="154" x2="410" y2="154"/>
  <rect class="c2-soft" x="44" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="60" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="60" y="184" text-anchor="middle">q₀</text>
  <rect class="c2-soft" x="94" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="110" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="110" y="184" text-anchor="middle">q₁</text>
  <rect class="c2-soft" x="144" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="160" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="160" y="184" text-anchor="middle">q₂</text>
  <rect class="c2-soft" x="194" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="210" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="210" y="184" text-anchor="middle">q₃</text>
  <rect class="c2-soft" x="244" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="260" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="260" y="184" text-anchor="middle">q₄</text>
  <rect class="c2-soft" x="294" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="310" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="310" y="184" text-anchor="middle">q₅</text>
  <rect class="c2-soft" x="344" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c2-txt" x="360" y="158" text-anchor="middle">Z</text>
  <text class="xs" x="360" y="184" text-anchor="middle">q₆</text>
  <rect class="c3-soft" x="394" y="141" width="32" height="26" rx="5"/>
  <text class="xsb c3-txt" x="410" y="158" text-anchor="middle">X,Y</text>
  <text class="xs" x="410" y="184" text-anchor="middle">q₇</text>
  <rect class="subpanel" x="34" y="202" width="416" height="140" rx="9"/>
  <text class="xsb c3-txt" x="46" y="220">Bravyi–Kitaev Fenwick 树（a₇† 权重 = 4，仅涉 {q₃, q₅, q₆, q₇}）</text>
  <line class="cwire" stroke-width="1.2" stroke-dasharray="3 3" x1="60" y1="318" x2="110" y2="294"/>
  <line class="cwire" stroke-width="1.2" stroke-dasharray="3 3" x1="110" y1="294" x2="210" y2="270"/>
  <line class="cwire" stroke-width="1.2" stroke-dasharray="3 3" x1="160" y1="318" x2="210" y2="270"/>
  <line class="cwire" stroke-width="1.2" stroke-dasharray="3 3" x1="260" y1="318" x2="310" y2="294"/>
  <line class="c1" stroke-width="2.1" x1="210" y1="270" x2="410" y2="246"/>
  <line class="c1" stroke-width="2.1" x1="310" y1="294" x2="410" y2="246"/>
  <line class="c1" stroke-width="2.1" x1="360" y1="318" x2="410" y2="246"/>
  <rect class="pill" x="44" y="307" width="32" height="22" rx="5"/>
  <text class="xs" x="60" y="322" text-anchor="middle">0:I</text>
  <rect class="pill" x="94" y="283" width="32" height="22" rx="5"/>
  <text class="xs" x="110" y="298" text-anchor="middle">1:I</text>
  <rect class="pill" x="144" y="307" width="32" height="22" rx="5"/>
  <text class="xs" x="160" y="322" text-anchor="middle">2:I</text>
  <rect class="c1-soft" x="194" y="259" width="32" height="22" rx="5"/>
  <text class="xsb c1-txt" x="210" y="274" text-anchor="middle">3:Z</text>
  <rect class="pill" x="244" y="307" width="32" height="22" rx="5"/>
  <text class="xs" x="260" y="322" text-anchor="middle">4:I</text>
  <rect class="c1-soft" x="294" y="283" width="32" height="22" rx="5"/>
  <text class="xsb c1-txt" x="310" y="298" text-anchor="middle">5:Z</text>
  <rect class="c1-soft" x="344" y="307" width="32" height="22" rx="5"/>
  <text class="xsb c1-txt" x="360" y="322" text-anchor="middle">6:Z</text>
  <rect class="c3-soft" x="391" y="235" width="38" height="22" rx="5"/>
  <text class="xsb c3-txt" x="410" y="250" text-anchor="middle">7:XY</text>
  <rect class="pill-bg" x="44" y="227" width="144" height="44" rx="7"/>
  <text class="xsb c1-txt" x="52" y="245">P(7) = q₃ ⊕ q₅ ⊕ q₆</text>
  <text class="xs" x="52" y="263">跳过 q₀–q₂, q₄（省半）</text>
  <rect class="c2-soft" x="34" y="350" width="134" height="44" rx="7"/>
  <text class="xsb c2-txt" x="101" y="367" text-anchor="middle">JW 映射</text>
  <text class="xs" x="101" y="385" text-anchor="middle">占据局域 · 宇称 O(N)</text>
  <rect class="c4-soft" x="175" y="350" width="134" height="44" rx="7"/>
  <text class="xsb c4-txt" x="242" y="367" text-anchor="middle">Parity 映射</text>
  <text class="xs" x="242" y="385" text-anchor="middle">宇称局域 · 占据 O(N)</text>
  <rect class="c3-soft" x="316" y="350" width="134" height="44" rx="7"/>
  <text class="xsb c3-txt" x="383" y="367" text-anchor="middle">BK 映射</text>
  <text class="xs" x="383" y="385" text-anchor="middle">双者均衡 O(log₂ N)</text>
  <rect class="note" x="34.0" y="404.0" width="416.0" height="30.0" rx="8"/>
  <text class="xsb" x="242.0" y="423.2" text-anchor="middle">BK 树形折中显著缩短泡利串长度，降低单步演化与测量电路深度</text>
  <rect class="panel" x="478.0" y="68.0" width="462.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 490.0 69.0 H 928.0 Q 939.0 69.0 939.0 80.0 V 99.0 H 479.0 V 80.0 Q 479.0 69.0 490.0 69.0 Z"/>
  <line class="grid" x1="479.0" y1="99.0" x2="939.0" y2="99.0"/>
  <text class="sec" x="491.0" y="89.5">2. 容错化学哈密顿量压缩：O(N⁴) → DF → THC Õ(N)</text>
  <rect class="c2-soft" x="492" y="108" width="434" height="76" rx="9"/>
  <line class="c2" stroke-width="1.7" x1="514" y1="126" x2="540" y2="140"/>
  <line class="c2" stroke-width="1.7" x1="514" y1="166" x2="540" y2="152"/>
  <line class="c2" stroke-width="1.7" x1="618" y1="126" x2="592" y2="140"/>
  <line class="c2" stroke-width="1.7" x1="618" y1="166" x2="592" y2="152"/>
  <rect class="pill-bg" x="536" y="132" width="60" height="28" rx="6"/>
  <text class="xsb c2-txt" x="566" y="150" text-anchor="middle">h_pqrs</text>
  <text class="xs c2-txt" x="506" y="128">p</text>
  <text class="xs c2-txt" x="506" y="172">q</text>
  <text class="xs c2-txt" x="622" y="128">r</text>
  <text class="xs c2-txt" x="622" y="172">s</text>
  <text class="smb c2-txt" x="646" y="128">① 朴素稀疏四指标积分（Sparse）</text>
  <text class="xs" x="646" y="149">独立项数：O(N⁴)   |   1-范数 λ：O(N²–N³)</text>
  <text class="xsb c2-txt" x="646" y="170">块编码：Õ(N²–N⁴) Toffoli（基线对照）</text>
  <line class="c1" stroke-width="1.90" x1="566.00" y1="185.00" x2="566.00" y2="205.15"/>
  <polygon class="c1-fill" points="566.00,209.00 562.70,202.00 569.30,202.00"/>
  <text class="xsb c1-txt" x="580" y="202">Cholesky 分解 + 轨道酉旋转 U^(ℓ)（O(N) Givens 门）</text>
  <rect class="c1-soft" x="492" y="211" width="434" height="78" rx="9"/>
  <line class="c1" stroke-width="2.0" x1="546" y1="248" x2="586" y2="248"/>
  <rect class="pill-bg" x="504" y="234" width="44" height="28" rx="6"/>
  <text class="xsb c1-txt" x="526" y="252" text-anchor="middle">L_pq</text>
  <rect class="pill-bg" x="584" y="234" width="44" height="28" rx="6"/>
  <text class="xsb c1-txt" x="606" y="252" text-anchor="middle">L_rs</text>
  <text class="xsb c1-txt" x="566" y="241" text-anchor="middle">ℓ</text>
  <text class="xs c1-txt" x="566" y="278" text-anchor="middle">L_DF = O(N)</text>
  <text class="smb c1-txt" x="646" y="231">② 双因子化（DF / 正则化 RC-DF）</text>
  <text class="xs" x="646" y="252">参数：O(N²–N³)   |   1-范数 λ：O(N^1.5)</text>
  <text class="xsb c1-txt" x="646" y="273">块编码：Õ(N^1.5–N²) Toffoli（P450 主力）</text>
  <line class="c3" stroke-width="1.90" x1="566.00" y1="290.00" x2="566.00" y2="310.15"/>
  <polygon class="c3-fill" points="566.00,314.00 562.70,307.00 569.30,307.00"/>
  <text class="xsb c3-txt" x="580" y="307">引入 M_THC = O(N) 非正交辅助格点 + 一元迭代 QROM</text>
  <rect class="c3-soft" x="492" y="316" width="434" height="78" rx="9"/>
  <line class="c3" stroke-width="1.9" x1="538" y1="353" x2="594" y2="353"/>
  <rect class="pill-bg" x="502" y="340" width="38" height="26" rx="5"/>
  <text class="xsb c3-txt" x="521" y="357" text-anchor="middle">χ_μ</text>
  <rect class="c3-fill" x="548" y="339" width="36" height="28" rx="6"/>
  <text class="badge-txt" x="566" y="357" text-anchor="middle">ζ_μν</text>
  <rect class="pill-bg" x="592" y="340" width="38" height="26" rx="5"/>
  <text class="xsb c3-txt" x="611" y="357" text-anchor="middle">χ_ν</text>
  <text class="xs c3-txt" x="566" y="383" text-anchor="middle">双指标核 ζ_μν</text>
  <text class="smb c3-txt" x="646" y="336">③ 张量超收缩（THC，渐近最优）</text>
  <text class="xs" x="646" y="357">参数：O(N²)     |     1-范数 λ：O(N–N^1.5)</text>
  <text class="xsb c3-txt" x="646" y="378">块编码：Õ(N) Toffoli（FeMoco ≈ 3.2×10¹⁰）</text>
  <rect class="note" x="492.0" y="404.0" width="434.0" height="30.0" rx="8"/>
  <text class="xsb" x="709.0" y="423.2" text-anchor="middle">总容错 QPE 代价 ∝ λ · Cost_BE / ε；DF/THC 将开销压低数个数量级</text>
</svg>
