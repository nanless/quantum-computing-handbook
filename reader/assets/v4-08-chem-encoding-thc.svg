<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">量子化学费米子编码与双因子化 THC 压缩结构</title>
  <desc id="desc">左面板对比 N=8 轨道下 Jordan-Wigner 链式 O(N) 与 Bravyi-Kitaev Fenwick 树形 O(log₂ N) 的费米算符 Pauli 权重；右面板展示容错量子化学哈密顿量由朴素 O(N⁴) 经双因子化 DF 压缩至张量超收缩 THC（Õ(N) Toffoli 复杂度）的层级结构。</desc>
  <style>
:root{color-scheme:light}
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.bg{fill:#FAF8F3}
.panel{fill:#ffffff;stroke:#d4cfc3;stroke-width:1.35}
