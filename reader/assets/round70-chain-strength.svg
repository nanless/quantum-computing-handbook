<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">量子退火链强度能级交叉与归一化局域场幅度衰减</title>
  <desc id="desc">两自旋教学模型 E = −2s_a + 2s_b − J s_a s_b（无量纲模型单位）：左图展示链完整态 (+,+)/(−,−)（能量 −J）与断链态 (+,−)（J−4）、(−,+)（J+4）在 J = 2、E = −2 处精确交叉，仅 J &gt; 2 保证所有基态链完整；右图展示全部系数统一缩放到 [−1, 1] 后，有效局域场幅 2/max(2, J) 在 J = 3 降至 2/3、在 J = 8 降至 1/4。</desc>
