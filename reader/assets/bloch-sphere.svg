  <line class="axis-neg" x1="336" y1="344" x2="336" y2="541.42"/>
  <line class="axis-neg" x1="336" y1="344" x2="509.13" y2="260.44"/>
  <line class="axis-neg" x1="336" y1="344" x2="156.93" y2="304.68"/>

