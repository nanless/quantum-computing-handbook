<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">两路径干涉：相对相位改变输出概率</title><desc id="desc">单粒子从路径0输入，两次理想均匀混合之间在路径1增加相位。采用Hadamard矩阵作为混合器相位约定。无路径记录时，输出0与1的概率分别为一加或减cos相位后除以二。线表示路径模式，不表示两颗粒子。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.bg{fill:#f7faf5}.ink{fill:#203e36}.muted{fill:#586f64}.panel{fill:#edf3e9;stroke:#c4d4c4}.box{fill:#fff2db;stroke:#b58c43;stroke-width:2}.line{stroke:#34765b;stroke-width:3;fill:none}.accent{stroke:#80639c;stroke-width:3;fill:none;stroke-dasharray:9 6}.axis{stroke:#73897d;stroke-width:1.5;fill:none}.title{font-size:27px;font-weight:600}.body{font-size:21px}.small{font-size:18px}.label{font-size:23px;font-weight:600}@media(prefers-color-scheme:dark){.bg{fill:#172820}.ink{fill:#eaf5ed}.muted{fill:#bacfc0}.panel{fill:#20392c;stroke:#52715c}.box{fill:#433824;stroke:#c9a262}.line{stroke:#a9d7ba}.accent{stroke:#d1b6ef}.axis{stroke:#98b7a3}}</style>
<rect class="bg" width="1100" height="530" rx="20"/>
<text class="title ink" x="32" y="45">两路径干涉：先分开振幅，再让振幅相加</text>
<text class="small muted" x="32" y="79">单粒子 · 理想 50:50 混合 · 采用 H 相位约定 · 光路非等比例</text>
<path class="line" d="M130 183H230M300 183H760M830 183H970M300 303H493M615 303H760M830 303H970"/>
<text class="body ink" x="45" y="173">输入 0</text>
<rect class="panel" x="230" y="143" width="70" height="200" rx="12"/><text class="label ink" x="265" y="249" text-anchor="middle">H</text>
<rect class="panel" x="760" y="143" width="70" height="200" rx="12"/><text class="label ink" x="795" y="249" text-anchor="middle">H</text>
<text class="small muted" x="345" y="163">路径 0：振幅 1 / √2</text>
<text class="small muted" x="335" y="341">路径 1</text>
<rect class="box" x="493" y="277" width="122" height="52" rx="10"/><text class="label ink" x="554" y="311" text-anchor="middle">相位 φ</text>
<text class="small muted" x="645" y="340">eⁱᵠ / √2</text>
<circle class="panel" cx="992" cy="183" r="23"/><text class="body ink" x="992" y="190" text-anchor="middle">0</text>
<circle class="panel" cx="992" cy="303" r="23"/><text class="body ink" x="992" y="310" text-anchor="middle">1</text>
<text class="small muted" x="220" y="382">第一次混合</text><text class="small muted" x="743" y="382">第二次混合</text>
<text class="body ink" x="40" y="432">P(0) = (1 + cos φ) / 2</text><text class="body ink" x="595" y="432">P(1) = (1 − cos φ) / 2</text>
<text class="small muted" x="40" y="477">φ = 0：输出 0；φ = π：输出 1；两次实验使用相同器件，只改变相对相位。</text>
<text class="small muted" x="40" y="507">本图无路径记录装置。若留下完全可区分的路径记录并忽略记录，两输出各为 1/2。</text></svg>
