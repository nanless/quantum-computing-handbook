  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title" x="32" y="52">经典模拟四大孤岛、四维量子优势边界与截断谱</text>
  <text class="subtitle" x="32" y="77">左：T 门数 × 纠缠键维 χ 相图与四大经典引擎疆域；右：含噪 Pauli 衰减 (1−p)<tspan dy="-4" font-size="72%">w</tspan><tspan dy="4">&#8203;</tspan> 与 MPS 奇异值谱</text>
