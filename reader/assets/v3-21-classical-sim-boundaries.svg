  <text class="sec" x="546" y="120">含噪 Pauli 衰减 (1−p)<tspan dy="-4" font-size="72%">w</tspan><tspan dy="4">&#8203;</tspan> 与 MPS 奇异值截断谱</text>
  <rect class="c1-soft" x="94" y="152" width="140" height="194" rx="6"/>
  <rect fill="url(#hatch-blue)" x="94" y="152" width="140" height="194" rx="6"/>
  <text class="xsb c1-txt" x="164" y="192" text-anchor="middle">Clifford / 稳定子表</text>
  <text class="xs c1-txt" x="164" y="216" text-anchor="middle">Stim: 门 O(n) / 空间 O(n²)</text>
  <text class="xs c1-txt" x="164" y="242" text-anchor="middle">少 T 扩展 2<tspan dy="-4" font-size="72%">0.396t</tspan><tspan dy="4">&#8203;</tspan></text>
  <text class="xs" x="164" y="274" text-anchor="middle">任意高纠缠</text>
  <text class="xs" x="164" y="294" text-anchor="middle">仍可经典秒算</text>
  <rect class="c4-soft" x="238" y="152" width="98" height="194" rx="6"/>
  <rect fill="url(#hatch-amber)" x="238" y="152" width="98" height="194" rx="6"/>
  <text class="xsb c4-txt" x="287" y="192" text-anchor="middle">含噪 Pauli 传播</text>
  <text class="xs c4-txt" x="287" y="216" text-anchor="middle">SPD / 噪声帘</text>
  <text class="xs c4-txt" x="287" y="244" text-anchor="middle">按 (1−p)<tspan dy="-4" font-size="72%">w</tspan><tspan dy="4">&#8203;</tspan> 剪枝</text>
  <text class="xs" x="287" y="274" text-anchor="middle">中等物理噪声下</text>
  <text class="xs" x="287" y="294" text-anchor="middle">高权项被绞杀</text>
  <rect class="c2-soft" stroke-width="2.4" x="340" y="152" width="160" height="98" rx="6"/>
  <rect fill="url(#hatch-red)" x="340" y="152" width="160" height="98" rx="6"/>
  <text class="xsb c2-txt" x="420" y="170" text-anchor="middle">★ 量子优势窗口 (FTQC)</text>
  <text class="xs" x="420" y="188" text-anchor="middle">① n &gt; 45  ② 大量非 Clifford T</text>
  <text class="xs" x="420" y="206" text-anchor="middle">③ 体积律高纠缠键维 χ</text>
  <text class="xsb c2-txt" x="420" y="224" text-anchor="middle">④ 逻辑噪 &lt; 10<tspan dy="-4" font-size="72%">−10</tspan><tspan dy="4">&#8203;</tspan></text>
  <text class="xs c2-txt" x="420" y="241" text-anchor="middle">且须跳出右侧代数孤岛</text>
  <rect class="c5-soft" stroke-width="1.8" stroke-dasharray="5 3" x="340" y="256" width="160" height="90" rx="7"/>
  <text class="xsb c5-txt" x="420" y="274" text-anchor="middle">匹配门 / 高斯口袋</text>
  <text class="xs" x="420" y="292" text-anchor="middle">高纠缠 + 任意连续角</text>
  <text class="xs c5-txt" x="420" y="310" text-anchor="middle">自由费米子代数封闭</text>
  <text class="xs c5-txt" x="420" y="328" text-anchor="middle">多项式模拟 O(n³)/O(m³)</text>
  <rect class="c3-soft" x="94" y="352" width="406" height="72" rx="6"/>
  <rect fill="url(#hatch-green)" x="94" y="352" width="406" height="72" rx="6"/>
  <text class="xsb c3-txt" x="297" y="373" text-anchor="middle">张量网络 MPS / 1D 砖墙 / BP-TN（低纠缠面积律）</text>
  <text class="xs c3-txt" x="297" y="393" text-anchor="middle">可吸收任意单比特非 Clifford T 门，仅受切面键维 χ 限制</text>
  <text class="xs" x="297" y="413" text-anchor="middle">（2026：468 T 门 1D 砖墙线路 37 min 经典算穿）</text>
