  <text class="xs" x="106" y="441" text-anchor="middle">t = 0</text>
  <text class="xs" x="230" y="441" text-anchor="middle">t ~ 50</text>
  <text class="xs" x="454" y="441" text-anchor="middle">t ≫ 10² (大量 T 门)</text>
  <text class="sm" x="297" y="462" text-anchor="middle">非 Clifford T 门数 t（魔术度 / 稳定子秩）</text>
  <text class="xs" x="86" y="416" text-anchor="end">χ ~ 2</text>
  <text class="xs" x="86" y="355" text-anchor="end">χ ~ 10³</text>
  <text class="xs" x="86" y="168" text-anchor="end">2<tspan dy="-4" font-size="72%">Ω(n)</tspan><tspan dy="4">&#8203;</tspan></text>
  <text class="sm" x="44" y="288" text-anchor="middle" transform="rotate(-90 44 288)">纠缠键维 χ（拓扑深度）</text>
  <rect class="pill" x="44" y="480" width="454" height="58" rx="9"/>
  <text class="xsb" x="271" y="501" text-anchor="middle">四维壁垒缺一不可：少 n→态矢量 | 少 T→稳定子 | 低 χ→MPS | 高噪→SPD</text>
  <text class="xs" x="271" y="522" text-anchor="middle">“难逐门模拟”仅为必要条件，实用优势还须战胜专用经典启发式算法</text>
  <text class="xsb" x="546" y="152">① 单层退极化伴随衰减 (1−p)<tspan dy="-4" font-size="72%">w</tspan><tspan dy="4">&#8203;</tspan>（对数纵轴，w = 0–20）</text>
