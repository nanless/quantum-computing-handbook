<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">经典模拟四大孤岛、四维量子优势边界与截断谱</title>
  <desc id="desc">左面板绘制非 Clifford T 门数与纠缠键维 χ 相图，划分四大经典可解疆域（Clifford/稳定子表、低纠缠张量网络 MPS/BP-TN、含噪 Pauli 传播 SPD，以及位于高纠缠高连续旋转角区的独立代数可解口袋——匹配门/高斯孤岛）与唯有容错 FTQC 跨越全部壁垒才可达的量子优势窗口。右面板上部精确绘制退极化噪声伴随映射按 Pauli 权重指数衰减 (1−p)^w（p = 0.001, 0.05, 0.15, 0.30），下部精确对比一维面积律指数衰减与深线路体积律平坦 MPS 奇异值谱 σ_k² 及 χ′=8 截断误差。</desc>
