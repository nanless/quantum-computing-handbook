  <text class="sec" x="44" y="120">四大经典可解孤岛与四维量子优势相图（示意）</text>
  <rect class="panel" x="530" y="96" width="442" height="456" rx="14"/>
  <path class="phead" d="M 544 97 H 958 Q 971 97 971 110 V 134 H 531 V 110 Q 531 97 544 97 Z"/>
