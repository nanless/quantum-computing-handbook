<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">稀释制冷机五温区冷量瀑布与 100 mK 静态基荷通道挤压</title>
  <desc id="desc">左面板以对数纵轴（1 μW 至 100 W）呈现稀释制冷机五温区可用冷量瀑布：50 K 板 30 W、4 K 板 1.5 W、1 K 蒸馏室 20 mW、100 mK 冷板 600 μW（多脉管大型稀释制冷机参考；单脉管 XLD400 约 200 μW @ 140 mK）与 20 mK 混合室 19 μW，跨越逾 6 个数量级。右面板基于 100 mK 总预算 600 μW 与 120 μW 线缆/I/O 底荷，绘制单通道功耗 0.4 μW、0.2 μW 直线与静态-复用耦合非线性挤压包络，精确标出基线（33.3% → 1,000 通道）、静态翻倍（46.7% → 1,600 通道）与理论峰值（60% → 1,800 通道）。</desc>
