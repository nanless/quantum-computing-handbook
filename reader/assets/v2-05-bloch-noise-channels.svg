<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="v2-05-bloch-noise-title v2-05-bloch-noise-desc">
  <title id="v2-05-bloch-noise-title">单比特四大噪声信道对 Bloch 球 x-z 截面圆的变换</title>
  <desc id="v2-05-bloch-noise-desc">2x2 四联图展示比特翻转(p=0.25)、相位翻转(p=0.25)、退极化(p=0.4)与振幅阻尼(γ=0.5)对 Bloch 球 x-z 单位圆的精确仿射收缩与不动点，曲线均由 Kraus 算子逐点计算。</desc>
