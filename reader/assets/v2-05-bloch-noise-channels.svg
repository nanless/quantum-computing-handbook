  <text class="sm muted" x="38" y="541">注：横轴 r<tspan dy="3" font-size="9.5">x</tspan><tspan dy="-3">&#8203;</tspan>、纵轴 r<tspan dy="3" font-size="9.5">z</tspan><tspan dy="-3">&#8203;</tspan> 为无量纲 Bloch 坐标（r<tspan dy="3" font-size="9.5">y</tspan><tspan dy="-3">&#8203;</tspan> = 0 截面）；退极化采用本书 §5.3 约定 𝒟<tspan dy="3" font-size="9.5">p</tspan><tspan dy="-3">&#8203;</tspan>(ρ) = (1−p)ρ + pI/2（等价于随机 Pauli 概率 q = 3p/4 = 0.3）。</text>
