span"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">率与坍缩）</tspan></tspan></text></g></g></g><g transform="translate(932.671875, 56.69999694824219)" id="flowchart-B-1" class="node default"><rect height="97.39999771118164" width="257.8125" y="-48.69999885559082" x="-128.90625" style="" class="basic label-container"></rect><g transform="translate(0, -30.69999885559082)" style="" class="label"><rect></rect><g><rect style="stroke: none" class="background"></rect><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">一般</tspan></tspan><tspan dy="1.1em" y="1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">POVM（正半定算符，仅</tspan></tspan><tspan dy="1.1em" y="2.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">决定结果概率）</tspan></tspan></text></g></g></g><g transform="translate(441.28125, 56.69999694824219)" id="flowchart-C-3" class="node default"><rect height="97.39999771118164" width="259" y="-48.69999885559082" x="-129.5" style="" class="basic label-container"></rect><g transform="translate(0, -30.69999885559082)" style="" class="label"><rect></rect><g><rect style="stroke: none" class="background"></rect><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">量子仪器（Kraus</tspan></tspan><tspan dy="1.1em" y="1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">分支映射，同时给出概率</tspan></tspan><tspan dy="1.1em" y="2.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">与后态）</tspan></tspan></text></g></g></g></g></g></g></svg>