  <circle class="c1-fill" cx="247.5" cy="260.2" r="4.2"/>
  <circle class="c2-fill" cx="247.5" cy="367.8" r="4.0"/>
  <circle class="c3-fill" cx="184.3" cy="173.2" r="4.6"/>
  <circle class="c4-fill" cx="82.0" cy="140.0" r="4.2"/>
  <rect class="pill-bg" x="94" y="137" width="184" height="20" rx="5"/>
  <text class="xsb c4-txt" x="186" y="151" text-anchor="middle">Q²|ψ₀⟩ = |G⟩ (5θ=90°, p₂=1)</text>
  <text class="xsb c3-txt" x="200" y="170">Q|ψ₀⟩ (3θ = 54°)</text>
  <text class="xs c3-txt" x="200" y="186">p₁ = sin²3θ ≈ 65.5%</text>
  <rect class="pill-bg" x="206" y="210" width="128" height="24" rx="7"/>
  <text class="xsb c3-txt" x="270" y="226" text-anchor="middle">Q = S₀S_χ：净转 +2θ</text>
  <text class="xsb c1-txt" x="257" y="258">|ψ₀⟩ (θ = 18°)</text>
  <text class="xs c1-txt" x="257" y="274">p₀ = sin²θ ≈ 9.5%</text>
  <text class="xsb c2-txt" x="257" y="366">S_χ|ψ₀⟩ (−θ)</text>
  <text class="xs c2-txt" x="257" y="382">① 沿 |B⟩ 反射</text>
  <rect class="note" x="34.0" y="404.0" width="400.0" height="30.0" rx="8"/>
  <text class="xsb" x="234.0" y="423.2" text-anchor="middle">每步净转 +2θ；最优步数 k ≈ ⌊π/(4θ)⌋，超步将过冲回落</text>
  <rect class="panel" x="460.0" y="68.0" width="480.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 472.0 69.0 H 928.0 Q 939.0 69.0 939.0 80.0 V 99.0 H 461.0 V 80.0 Q 461.0 69.0 472.0 69.0 Z"/>
