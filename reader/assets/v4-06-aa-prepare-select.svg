  <text class="sec" x="473.0" y="89.5">2. H = 0.6X + 0.8Z 显式 6 门 PREPARE/SELECT 电路</text>
  <rect class="c3" stroke-width="1.2" stroke-dasharray="4 3" x="526" y="114" width="76" height="132" rx="7"/>
  <text class="xsb c3-txt" x="564" y="131" text-anchor="middle">PREPARE</text>
  <rect class="c1" stroke-width="1.2" stroke-dasharray="4 3" x="612" y="114" width="154" height="132" rx="7"/>
  <text class="xsb c1-txt" x="689" y="131" text-anchor="middle">SELECT = diag(X, Z)</text>
  <rect class="c2" stroke-width="1.2" stroke-dasharray="4 3" x="776" y="114" width="82" height="132" rx="7"/>
  <text class="xsb c2-txt" x="817" y="131" text-anchor="middle">PREPARE†</text>
  <line class="wire" x1="516" y1="166" x2="862" y2="166"/>
  <line class="wire" x1="516" y1="218" x2="862" y2="218"/>
  <text class="smb" x="510" y="170" text-anchor="end">|0⟩_a</text>
  <text class="smb" x="510" y="222" text-anchor="end">|ψ⟩_s</text>
  <text class="xsb c2-txt" x="868" y="170">⟨0|_a 投影</text>
  <text class="xsb c3-txt" x="868" y="222">(H/α)|ψ⟩</text>
  <rect class="c3-soft" x="537.0" y="153.0" width="54.0" height="26.0" rx="5"/>
  <text class="xsb c3-txt" x="564.0" y="170.5" text-anchor="middle">Ry(θ)</text>
