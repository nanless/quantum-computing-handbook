  <text class="gate-txt c1-txt" x="744.0" y="170.5" text-anchor="middle">X</text>
  <rect class="c2-soft" x="787.0" y="153.0" width="60.0" height="26.0" rx="5"/>
  <text class="xsb c2-txt" x="817.0" y="170.5" text-anchor="middle">Ry(−θ)</text>
  <rect class="subpanel" x="474" y="260" width="220" height="134" rx="9"/>
  <text class="xsb c3-txt" x="584" y="280" text-anchor="middle">投影块 ⟨0|_a U |0⟩_a = H / α</text>
  <text class="xs" x="584" y="300" text-anchor="middle">= (3/7)X + (4/7)Z</text>
  <rect class="c1-soft" x="514" y="312" width="68" height="32" rx="4"/>
  <text class="math-txt c1-txt" x="548.0" y="333.0" text-anchor="middle">+4/7</text>
  <rect class="c3-soft" x="584" y="312" width="68" height="32" rx="4"/>
  <text class="math-txt c3-txt" x="618.0" y="333.0" text-anchor="middle">+3/7</text>
  <rect class="c3-soft" x="514" y="346" width="68" height="32" rx="4"/>
  <text class="math-txt c3-txt" x="548.0" y="367.0" text-anchor="middle">+3/7</text>
  <rect class="c1-soft" x="584" y="346" width="68" height="32" rx="4"/>
  <text class="math-txt c1-txt" x="618.0" y="367.0" text-anchor="middle">−4/7</text>
  <rect class="subpanel" x="706" y="260" width="220" height="134" rx="9"/>
  <text class="xsb c1-txt" x="718" y="280">参数设定与成功概率验算</text>
  <text class="xs" x="718" y="303">1-范数缩放：α = 0.6 + 0.8 = 1.4</text>
  <text class="xs" x="718" y="323">振幅分配：cos²(θ/2)=3/7, sin²=4/7</text>
  <text class="xs" x="718" y="343">旋转角：θ = 2·atan(2/√3) ≈ 98.21°</text>
  <text class="xsb c2-txt" x="718" y="364">成功概率：p₀ = 1/α² ≈ 51.0%</text>
  <text class="xs" x="718" y="383">（因 H² = (0.36+0.64)I = I 恒定）</text>
  <rect class="note" x="474.0" y="404.0" width="452.0" height="30.0" rx="8"/>
  <text class="xsb" x="700.0" y="423.2" text-anchor="middle">6 门显式构造把抽象块编码落成硬件门，可直接衔接量子化与 QSVT</text>
</svg>
