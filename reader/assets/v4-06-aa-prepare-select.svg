<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">振幅放大几何旋转与显式 6 门 PREPARE/SELECT 块编码电路</title>
  <desc id="desc">左面板展示振幅放大在 {|B⟩, |G⟩} 二维平面内通过 S_χ 与 S₀ 两次反射合成 +2θ 净旋转的精确几何（θ=18° 时两步直达 |G⟩）；右面板给出 H = 0.6X + 0.8Z 的 6 门显式 PREPARE/SELECT 块编码电路、投影子块矩阵与成功概率 51.0% 验算。</desc>
