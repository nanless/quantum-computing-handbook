<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">张量积组合系统，偏迹提取边缘</title>
  <desc id="desc">左面板展示 2×2 矩阵 A 与印章 B 通过张量积生成 4×4 块矩阵的升维过程及数值验算；右面板以 Bell 态密度矩阵为例，展示偏迹 Tr_B（逐块取迹）与 Tr_A（主对角块相加）从 4×4 矩阵提取 2×2 约化态 I/2。均匀混合态 I₄/4 的两个边缘也都是 I/2，无法只靠边缘确定联合态。</desc>
