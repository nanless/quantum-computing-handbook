<title id="title">无限深势阱的波函数与概率密度并不是同一条曲线</title><desc id="desc">左图绘出前两个能量本征态的无量纲实振幅，右图是相应无量纲概率密度。实线为n等于1，虚线为n等于2。横坐标均为位置除以井宽，从零到一。振幅可以为负，密度非负；n等于2在中点有节点。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.bg{fill:#f7faf5}.ink{fill:#203e36}.muted{fill:#586f64}.panel{fill:#edf3e9;stroke:#c4d4c4}.box{fill:#fff2db;stroke:#b58c43;stroke-width:2}.line{stroke:#34765b;stroke-width:3;fill:none}.accent{stroke:#80639c;stroke-width:3;fill:none;stroke-dasharray:9 6}.axis{stroke:#73897d;stroke-width:1.5;fill:none}.title{font-size:27px;font-weight:600}.body{font-size:21px}.small{font-size:18px}.label{font-size:23px;font-weight:600}
.bg{fill:#172820}.ink{fill:#eaf5ed}.muted{fill:#bacfc0}.panel{fill:#20392c;stroke:#52715c}.box{fill:#433824;stroke:#c9a262}.line{stroke:#a9d7ba}.accent{stroke:#d1b6ef}.axis{stroke:#98b7a3}
</style>
