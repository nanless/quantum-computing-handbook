<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">有限计数线性层析落在 Bloch 单位圆外与径向正半定投影</title>
  <desc id="desc">左图以 1:1 等比例绘制 r_z = 0 赤道截面单位圆盘：三基独立 10 次测量计数（X 9/1、Y 9/1、Z 5/5）给出落在球外的原始线性估计（方形标记，(0.8, 0.8)，半径 1.13137，负本征值 −0.06569）；径向投影将其拉回物理边界圆周（圆形标记，(0.7071, 0.7071)，本征值 1 与 0），但不增加新的测量证据。</desc>
  <style>
:root{color-scheme:dark}
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.bg{fill:#f8fafc}
.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4}
.subpanel{fill:#f4f8fb;stroke:#d1dde8;stroke-width:1.2}
.phead{fill:#eef4f8}
.title{font-size:20px;font-weight:700;fill:#13263a}
.subtitle{font-size:13px;font-weight:400;fill:#3e566d}
.sec{font-size:14.5px;font-weight:700;fill:#13263a}
.lbl{font-size:13px;font-weight:500;fill:#19324d}
.lblb{font-size:13px;font-weight:700;fill:#13263a}
.sm{font-size:12px;font-weight:400;fill:#3e566d}
.smb{font-size:12px;font-weight:600;fill:#19324d}
.xs{font-size:11px;font-weight:500;fill:#3e566d}
.xsb{font-size:11px;font-weight:700;fill:#19324d}
.axis{stroke:#19324d;stroke-width:1.7;fill:none}
.axis-fill{fill:#19324d}
.grid{stroke:#dce5ee;stroke-width:1;fill:none}
.guide{stroke:#7c93a8;stroke-width:1.25;stroke-dasharray:5 4;fill:none}
.unit-circle{stroke:#5b7790;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.bloch-disk{fill:#dff4ff;fill-opacity:.38;stroke:#1b6ca8;stroke-width:2.2}
.c1{stroke:#1b6ca8;fill:none}
.c1-fill{fill:#1b6ca8}
.c1-txt{fill:#145282}
.c1-soft{fill:#e1f1fb;stroke:#1b6ca8;stroke-width:1.4}
.c2{stroke:#c74b34;fill:none}
.c2-fill{fill:#c74b34}
.c2-txt{fill:#a63824}
.c2-soft{fill:#fce8e3;stroke:#c74b34;stroke-width:1.4}
.c3{stroke:#1e7a5c;fill:none}
.c3-fill{fill:#1e7a5c}
.c3-txt{fill:#155e46}
.c3-soft{fill:#e2f5ee;stroke:#1e7a5c;stroke-width:1.4}
.c4{stroke:#b57614;fill:none}
.c4-fill{fill:#b57614}
.c4-txt{fill:#8a5609}
.c4-soft{fill:#fff4d8;stroke:#b57614;stroke-width:1.4}
.note{fill:#fff8e6;stroke:#c98d24;stroke-width:1.3}
.pill{fill:#f3f7fa;stroke:#9cb1c4;stroke-width:1.2}
.pill-bg{fill:#ffffff;fill-opacity:.94;stroke:#9cb1c4;stroke-width:1.1}
.node-bg{fill:#ffffff}
.area1{fill:#1b6ca8;fill-opacity:.13}
.area2{fill:#c74b34;fill-opacity:.12}
.area3{fill:#1e7a5c;fill-opacity:.13}
.forbid{fill:#c74b34;fill-opacity:.09}
.bar-bg{fill:#e2e8f0}
.hatch-stroke1{stroke:#1b6ca8;stroke-width:1.1;stroke-opacity:.42}
.hatch-stroke2{stroke:#c74b34;stroke-width:1.1;stroke-opacity:.45}
.hatch-stroke3{stroke:#1e7a5c;stroke-width:1.1;stroke-opacity:.42}

.bg{fill:#0f1720}
  .panel{fill:#16222e;stroke:#354c61}
  .subpanel{fill:#1b2a38;stroke:#3b5369}
  .phead{fill:#1c2d3d}
  .title,.sec,.lblb{fill:#eef6ff}
  .subtitle,.sm,.xs{fill:#b7cde0}
  .lbl,.smb,.xsb{fill:#d7e7f5}
  .axis{stroke:#cde0f2}
  .axis-fill{fill:#cde0f2}
  .grid{stroke:#293e52}
  .guide,.unit-circle{stroke:#738fa8}
  .bloch-disk{fill:#164968;fill-opacity:.40;stroke:#6bc2f5}
  .c1{stroke:#6bc2f5}
  .c1-fill{fill:#6bc2f5}
  .c1-txt{fill:#8fd4fa}
  .c1-soft{fill:#173a52;stroke:#6bc2f5}
  .c2{stroke:#f28872}
  .c2-fill{fill:#f28872}
  .c2-txt{fill:#f8a896}
  .c2-soft{fill:#48241e;stroke:#f28872}
  .c3{stroke:#5dd1a8}
  .c3-fill{fill:#5dd1a8}
  .c3-txt{fill:#84e0bf}
  .c3-soft{fill:#163d31;stroke:#5dd1a8}
  .c4{stroke:#f0ba5a}
  .c4-fill{fill:#f0ba5a}
  .c4-txt{fill:#f5cc82}
  .c4-soft{fill:#3d3014;stroke:#f0ba5a}
  .note{fill:#332914;stroke:#d6a240}
  .pill{fill:#203142;stroke:#4f6b85}
  .pill-bg{fill:#16222e;fill-opacity:.94;stroke:#4f6b85}
  .node-bg{fill:#16222e}
  .area1{fill:#6bc2f5;fill-opacity:.16}
  .area2{fill:#f28872;fill-opacity:.15}
  .area3{fill:#5dd1a8;fill-opacity:.16}
  .forbid{fill:#f28872;fill-opacity:.12}
  .bar-bg{fill:#273a4c}
  .hatch-stroke1{stroke:#6bc2f5;stroke-opacity:.48}
  .hatch-stroke2{stroke:#f28872;stroke-opacity:.52}
  .hatch-stroke3{stroke:#5dd1a8;stroke-opacity:.48}

  </style>
  <defs>
    <pattern id="hatch-blue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-stroke1" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="hatch-stroke2" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <pattern id="hatch-green" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-stroke3" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title" x="34" y="52">单比特有限计数层析：球外线性重构与径向正半定投影</text>
  <text class="subtitle" x="34" y="76">r<tspan dy="3" font-size="75%">z</tspan><tspan dy="-3">&#8203;</tspan> = 0 赤道截面（1:1 等比例，无量纲 Bloch 坐标）· 三基各独立 10 次测量：X 9/1、Y 9/1、Z 5/5</text>
  <rect class="panel" x="28" y="94" width="478" height="456" rx="14"/>
  <path class="phead" d="M 42 95 H 492 Q 505 95 505 108 V 132 H 29 V 108 Q 29 95 42 95 Z"/>
  <line class="grid" x1="29" y1="132" x2="505" y2="132"/>
  <text class="sec" x="44" y="118">Bloch 球赤道截面（r<tspan dy="3" font-size="75%">z</tspan><tspan dy="-3">&#8203;</tspan> = 0，1:1 等比例）</text>
  <rect class="panel" x="522" y="94" width="450" height="456" rx="14"/>
  <path class="phead" d="M 536 95 H 958 Q 971 95 971 108 V 132 H 523 V 108 Q 523 95 536 95 Z"/>
  <line class="grid" x1="523" y1="132" x2="971" y2="132"/>
  <text class="sec" x="538" y="118">三步诊断：从有限计数到合法物理密度矩阵</text>
  <line class="grid" x1="116" y1="192" x2="116" y2="460"/>
  <line class="grid" x1="116" y1="460" x2="384" y2="460"/>
  <line class="grid" x1="183" y1="192" x2="183" y2="460"/>
  <line class="grid" x1="116" y1="393" x2="384" y2="393"/>
  <line class="grid" x1="317" y1="192" x2="317" y2="460"/>
  <line class="grid" x1="116" y1="259" x2="384" y2="259"/>
  <line class="grid" x1="384" y1="192" x2="384" y2="460"/>
  <line class="grid" x1="116" y1="192" x2="384" y2="192"/>
  <circle class="bloch-disk" cx="250" cy="326" r="134"/>
  <circle class="unit-circle" cx="250" cy="326" r="67"/>
  <line class="axis" x1="90" y1="326" x2="418" y2="326"/>
  <polygon class="axis-fill" points="420,326 412.5,329.6 412.5,322.4"/>
  <line class="axis" x1="250" y1="480" x2="250" y2="168"/>
  <polygon class="axis-fill" points="250,166 253.6,173.5 246.4,173.5"/>
  <line class="axis" stroke-width="1.3" x1="116" y1="322" x2="116" y2="330"/>
  <text class="xs" x="104" y="344" text-anchor="middle">−1</text>
  <line class="axis" stroke-width="1.3" x1="246" y1="460" x2="254" y2="460"/>
  <text class="xs" x="241" y="474" text-anchor="end">−1</text>
  <line class="axis" stroke-width="1.3" x1="183" y1="322" x2="183" y2="330"/>
  <text class="xs" x="169" y="344" text-anchor="middle">−0.5</text>
  <line class="axis" stroke-width="1.3" x1="246" y1="393" x2="254" y2="393"/>
  <text class="xs" x="241" y="405" text-anchor="end">−0.5</text>
  <line class="axis" stroke-width="1.3" x1="317" y1="322" x2="317" y2="330"/>
  <text class="xs" x="330" y="344" text-anchor="middle">0.5</text>
  <line class="axis" stroke-width="1.3" x1="246" y1="259" x2="254" y2="259"/>
  <text class="xs" x="241" y="252" text-anchor="end">0.5</text>
  <line class="axis" stroke-width="1.3" x1="384" y1="322" x2="384" y2="330"/>
  <text class="xs" x="394" y="344" text-anchor="middle">1</text>
  <line class="axis" stroke-width="1.3" x1="246" y1="192" x2="254" y2="192"/>
  <text class="xs" x="241" y="185" text-anchor="end">1</text>
  <text class="xs" x="241" y="342" text-anchor="end">0</text>
  <text class="smb" x="250" y="157" text-anchor="middle">r<tspan dy="3" font-size="75%">y</tspan><tspan dy="-3">&#8203;</tspan>（无量纲）</text>
  <text class="smb" x="456" y="316" text-anchor="middle">r<tspan dy="3" font-size="75%">x</tspan><tspan dy="-3">&#8203;</tspan>（无量纲）</text>
  <line class="c2" stroke-width="2.2" stroke-dasharray="6 4" x1="344.75" y1="231.25" x2="357.2" y2="218.8"/>
  <line class="c3" stroke-width="3.0" x1="250" y1="326" x2="344.75" y2="231.25"/>
  <rect class="c2-fill" x="351.7" y="213.3" width="11" height="11" rx="1.5"/>
  <circle class="node-bg c3" stroke-width="3.0" cx="344.75" cy="231.25" r="5.5"/>
  <rect class="c2-soft" x="358" y="144" width="136" height="42" rx="8"/>
  <text class="xsb c2-txt" x="426" y="162" text-anchor="middle">■ 原始估计 (0.8, 0.8)</text>
  <text class="xs c2-txt" x="426" y="178" text-anchor="middle">|r̂| ≈ 1.131 &gt; 1（球外）</text>
  <line class="c2" stroke-width="1.3" x1="362.2" y1="213.8" x2="394" y2="186"/>
  <rect class="c3-soft" x="352" y="246" width="144" height="42" rx="8"/>
  <text class="xsb c3-txt" x="424" y="264" text-anchor="middle">○ 径向投影 (0.707, 0.707)</text>
  <text class="xs c3-txt" x="424" y="280" text-anchor="middle">|r*| = 1（纯态圆周）</text>
  <line class="c3" stroke-width="1.3" x1="350.75" y1="233.25" x2="372" y2="246"/>
  <rect class="pill-bg" x="44" y="148" width="128" height="36" rx="8"/>
  <text class="xsb c1-txt" x="108" y="164" text-anchor="middle">物理圆盘可行域</text>
  <text class="xs c1-txt" x="108" y="178" text-anchor="middle">r<tspan dy="3" font-size="75%">x</tspan><tspan dy="-3">&#8203;</tspan>² + r<tspan dy="3" font-size="75%">y</tspan><tspan dy="-3">&#8203;</tspan>² ≤ 1</text>
  <rect class="pill" x="44" y="502" width="446" height="34" rx="8"/>
  <text class="sm" x="267" y="523" text-anchor="middle">方形 = 球外线性估计，圆形 = 径向投影估计；投影沿半径拉回圆周</text>
  <rect class="c1-soft" x="538" y="144" width="418" height="118" rx="10"/>
  <text class="smb c1-txt" x="552" y="165">① 保留三组原始计数（每基各独立 10 次测量）</text>
  <text class="sm" x="552" y="192">X 基：9 正 / 1 负</text>
  <rect class="bar-bg" x="668" y="181" width="152" height="12" rx="4"/>
  <rect class="c1-fill" x="668" y="181" width="136.8" height="12" rx="4"/>
  <text class="smb" x="942" y="192" text-anchor="end">r̂<tspan dy="3" font-size="75%">x</tspan><tspan dy="-3">&#8203;</tspan> = +0.80</text>
  <text class="sm" x="552" y="220">Y 基：9 正 / 1 负</text>
  <rect class="bar-bg" x="668" y="209" width="152" height="12" rx="4"/>
  <rect class="c1-fill" x="668" y="209" width="136.8" height="12" rx="4"/>
  <text class="smb" x="942" y="220" text-anchor="end">r̂<tspan dy="3" font-size="75%">y</tspan><tspan dy="-3">&#8203;</tspan> = +0.80</text>
  <text class="sm" x="552" y="248">Z 基：5 正 / 5 负</text>
  <rect class="bar-bg" x="668" y="237" width="152" height="12" rx="4"/>
  <rect class="c3-fill" x="668" y="237" width="76" height="12" rx="4"/>
  <text class="smb" x="942" y="248" text-anchor="end">r̂<tspan dy="3" font-size="75%">z</tspan><tspan dy="-3">&#8203;</tspan> =  0.00</text>
  <rect class="c2-soft" x="538" y="272" width="418" height="94" rx="10"/>
  <text class="smb c2-txt" x="552" y="293">② 检验整张密度矩阵正半定性（不可只看对角元）</text>
  <text class="sm" x="552" y="316">线性重构 ρ̂ = ½(I + 0.8X + 0.8Y)，半径 |r̂| = √1.28 ≈ 1.13137</text>
  <text class="smb c2-txt" x="552" y="337">本征值 λ<tspan dy="3" font-size="75%">+</tspan><tspan dy="-3">&#8203;</tspan> ≈ 1.06569，λ<tspan dy="3" font-size="75%">−</tspan><tspan dy="-3">&#8203;</tspan> ≈ −0.06569 &lt; 0（非物理）</text>
  <text class="xs" x="552" y="356">有限样本统计涨落即可推出球外，不能把负本征值误判为设备故障</text>
  <rect class="c3-soft" x="538" y="376" width="418" height="84" rx="10"/>
  <text class="smb c3-txt" x="552" y="397">③ 径向欧氏投影（单比特 Frobenius 最近合法态）</text>
  <text class="sm" x="552" y="420">r* = r̂ / |r̂| = (1/√2, 1/√2, 0) ≈ (0.7071, 0.7071, 0)</text>
  <text class="smb c3-txt" x="552" y="443">投影后半径归 1，本征值恢复为 1 与 0（满足 ρ* ≽ 0）</text>
  <rect class="note" x="538" y="470" width="418" height="66" rx="10"/>
  <text class="smb c4-txt" x="552" y="490">方法边界提醒（必须声明所用的物理修正方式）</text>
  <text class="sm" x="552" y="510">投影仅将点估计拉回物理可行域，不增加新的测量证据，也不是置信区间；</text>
  <text class="sm" x="552" y="527">多比特高维层析应使用带物理约束的最大似然估计（MLE）。</text>
</svg>
