<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">BB84 协议关键流程与纯损耗光纤 PLOB 容量上限</title>
  <desc id="desc">左面板展示 BB84 量子密钥分发四阶段流程：选基发态、随机选基测量、经已认证经典信道比基筛选、随机公开抽检估计 QBER。右面板以对数纵轴（10⁻⁶ 至 10¹ bit/模式）精确绘制 0.2 dB/km 光纤（透射率 η = 10⁻⁰·⁰²ᴸ）下无中继 PLOB 秘密密钥容量上限 C_PLOB = −log₂(1−η) 随距离 L ∈ [0, 300] km 的衰减曲线，并标出 50 km（0.152）、100 km（0.0145）与 200 km（1.44×10⁻⁴）数值。</desc>
