  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title" x="34" y="54">BB84 密钥分发流程与纯损耗光纤 PLOB 容量上限</text>
  <text class="subtitle" x="34" y="79">左：BB84 四阶段筛选与 QBER 抽检流程；右：光纤透射率 η = 10⁻⁰·⁰²ᴸ 下的无中继理论极限</text>
  <rect class="panel" x="28" y="96" width="424" height="456" rx="14"/>
  <path class="phead" d="M 42 97 H 438 Q 451 97 451 110 V 135 H 29 V 110 Q 29 97 42 97 Z"/>
  <line class="grid" x1="29" y1="135" x2="451" y2="135"/>
  <text class="sec" x="44" y="121">BB84 密钥分发关键步骤（非等比例流程）</text>
  <rect class="panel" x="468" y="96" width="504" height="456" rx="14"/>
  <path class="phead" d="M 482 97 H 958 Q 971 97 971 110 V 135 H 469 V 110 Q 469 97 482 97 Z"/>
  <line class="grid" x1="469" y1="135" x2="971" y2="135"/>
  <text class="sec" x="484" y="121">PLOB 无中继秘密密钥容量上限（0.2 dB/km）</text>
  <rect class="c1-soft" x="46" y="148" width="388" height="72" rx="10"/>
  <circle class="c1-fill" cx="70" cy="172" r="12"/>
  <text class="badge-txt" x="70" y="176.5" text-anchor="middle">1</text>
  <text class="smb" x="92" y="173">选基与发态（Alice）</text>
  <text class="sm" x="92" y="193">随机选比特 b ∈ {0,1} 与基 Z / X</text>
  <text class="sm" x="92" y="211">发出单光子态 |0⟩,|1⟩ 或 |+⟩,|−⟩</text>
  <line class="axis" x1="240" y1="221" x2="240" y2="236"/>
  <polygon class="axis-fill" points="240,237 236.88,230.5 243.12,230.5"/>
  <rect class="c2-soft" x="46" y="238" width="388" height="72" rx="10"/>
  <circle class="c2-fill" cx="70" cy="262" r="12"/>
  <text class="badge-txt" x="70" y="266.5" text-anchor="middle">2</text>
  <text class="smb" x="92" y="263">随机选基测量（Bob）</text>
  <text class="sm" x="92" y="283">独立随机选 Z / X 基探测到达光子</text>
  <text class="sm" x="92" y="301">光纤损耗使单光子仅以概率 η 到达</text>
  <line class="axis" x1="240" y1="311" x2="240" y2="326"/>
  <polygon class="axis-fill" points="240,327 236.88,320.5 243.12,320.5"/>
  <rect class="c3-soft" x="46" y="328" width="388" height="72" rx="10"/>
  <circle class="c3-fill" cx="70" cy="352" r="12"/>
  <text class="badge-txt" x="70" y="356.5" text-anchor="middle">3</text>
  <text class="smb" x="92" y="353">经典比基筛选（Sifting）</text>
  <text class="sm" x="92" y="373">经已认证经典信道公开各自基选择</text>
  <text class="sm" x="92" y="391">同基结果保留（约 50%），异基丢弃</text>
  <line class="axis" x1="240" y1="401" x2="240" y2="416"/>
  <polygon class="axis-fill" points="240,417 236.88,410.5 243.12,410.5"/>
  <rect class="pill" x="46" y="418" width="388" height="72" rx="10"/>
  <circle class="axis-fill" cx="70" cy="442" r="12"/>
  <text class="badge-txt" x="70" y="446.5" text-anchor="middle">4</text>
  <text class="smb" x="92" y="443">公开抽检估计 QBER</text>
  <text class="sm" x="92" y="463">牺牲随机子集测误码率 Q（重发攻击 25%）</text>
  <text class="sm" x="92" y="481">再行信息协调（纠错）与隐私放大</text>
  <rect class="note" x="46" y="496" width="388" height="44" rx="9"/>
  <text class="sm" x="60" y="514">安全边界：经典信道须已认证；公开抽检比特须销毁。</text>
  <text class="sm" x="60" y="532">25% 为全截获重发期望值，不是“低于即安全”的门槛。</text>
  <line class="grid" x1="552" y1="446" x2="944" y2="446"/>
  <text class="sm" x="544" y="450.5" text-anchor="end">10⁻⁶</text>
  <line class="grid" x1="552" y1="407.14" x2="944" y2="407.14"/>
  <text class="sm" x="544" y="411.64" text-anchor="end">10⁻⁵</text>
  <line class="grid" x1="552" y1="368.29" x2="944" y2="368.29"/>
  <text class="sm" x="544" y="372.79" text-anchor="end">10⁻⁴</text>
  <line class="grid" x1="552" y1="329.43" x2="944" y2="329.43"/>
  <text class="sm" x="544" y="333.93" text-anchor="end">10⁻³</text>
  <line class="grid" x1="552" y1="290.57" x2="944" y2="290.57"/>
  <text class="sm" x="544" y="295.07" text-anchor="end">10⁻²</text>
  <line class="grid" x1="552" y1="251.71" x2="944" y2="251.71"/>
  <text class="sm" x="544" y="256.21" text-anchor="end">10⁻¹</text>
  <line class="grid" x1="552" y1="212.86" x2="944" y2="212.86"/>
  <text class="sm" x="544" y="217.36" text-anchor="end">10⁰</text>
  <line class="grid" x1="552" y1="174" x2="944" y2="174"/>
  <text class="sm" x="544" y="178.5" text-anchor="end">10¹</text>
  <line class="grid" x1="552" y1="174" x2="552" y2="446"/>
  <text class="sm" x="552" y="466" text-anchor="middle">0</text>
  <line class="grid" x1="617.33" y1="174" x2="617.33" y2="446"/>
  <text class="sm" x="617.33" y="466" text-anchor="middle">50</text>
  <line class="grid" x1="682.67" y1="174" x2="682.67" y2="446"/>
  <text class="sm" x="682.67" y="466" text-anchor="middle">100</text>
  <line class="grid" x1="748" y1="174" x2="748" y2="446"/>
  <text class="sm" x="748" y="466" text-anchor="middle">150</text>
  <line class="grid" x1="813.33" y1="174" x2="813.33" y2="446"/>
  <text class="sm" x="813.33" y="466" text-anchor="middle">200</text>
  <line class="grid" x1="878.67" y1="174" x2="878.67" y2="446"/>
  <text class="sm" x="878.67" y="466" text-anchor="middle">250</text>
  <line class="grid" x1="944" y1="174" x2="944" y2="446"/>
  <text class="sm" x="944" y="466" text-anchor="middle">300</text>
