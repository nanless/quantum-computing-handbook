  <circle class="c2-fill" cx="922.0" cy="235.0" r="3.6"/>
  <rect class="c3-fill" x="544.7" y="163.7" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="601.0" y="190.2" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="657.3" y="215.5" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="713.6" y="240.4" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="769.9" y="265.2" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="826.2" y="290.0" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="882.5" y="314.8" width="6.6" height="6.6" rx="1"/>
  <rect class="c3-fill" x="918.7" y="330.7" width="6.6" height="6.6" rx="1"/>
  <rect class="axis" stroke-width="1.4" x="548.0" y="138.0" width="374.0" height="214.0"/>
  <text class="smb" x="735.0" y="391" text-anchor="middle">Trotter 切片步数 r（对数坐标）</text>
  <text class="smb" x="496" y="245" transform="rotate(-90 496 245)" text-anchor="middle">算符谱范数误差 ‖e⁻ⁱᴴᵗ − S_p‖₂</text>
  <rect class="pill-bg" x="742" y="145" width="170" height="42" rx="7"/>
  <text class="xsb c2-txt" x="827" y="163" text-anchor="middle">一阶 S₁ 实测斜率 -1.00</text>
