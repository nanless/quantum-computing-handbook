  <text class="xsb c1-txt" x="649" y="338" text-anchor="middle">r=100 精度提升 255×</text>
  <rect class="note" x="492.0" y="404.0" width="434.0" height="30.0" rx="8"/>
  <text class="xsb" x="709.0" y="423.2" text-anchor="middle">S₂ 合并相邻半步仅需 2r+1 门（相对 S₁ 的 2r 仅多 1 门），误差跃升一阶</text>
