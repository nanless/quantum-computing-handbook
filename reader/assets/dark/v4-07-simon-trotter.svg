<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Simon 异或陪集结构与 Trotter 误差双对数缩放曲线</title>
  <desc id="desc">左面板展示 Simon 算法中隐藏串 s = 101 将 8 个 3 比特输入配成 4 组异或陪集，并经 H⊗³ 干涉滤出正交子空间 {000, 010, 101, 111}；右面板在双对数坐标下实算 H = X + Z (t = 1) 的一阶与二阶对称 Trotter 谱范数误差，验证斜率 −1 与 −2 缩放规律。</desc>
