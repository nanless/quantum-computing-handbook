<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">量子信道容量阶梯与核心计算复杂度类包含谱系</title>
  <desc id="desc">左面板以精确解析公式绘出单比特擦除信道四类容量阶梯 Q = P = max(0,1−2ε) ≤ C = 1−ε ≤ C_E = 2(1−ε)、单比特退相位量子容量 Q_deph(p) = 1 − h₂(p) 与纯损耗玻色信道 PLOB 双向上界 −log₂(ε)（η = 1 − ε），并标出 ε = 1/2 处可降解/反降解相变点；右面板以嵌套层级展示 P ⊆ BPP ⊆ BQP ⊆ QCMA ⊆ QMA ⊆ QIP = PSPACE ⊆ MIP* = RE。</desc>
