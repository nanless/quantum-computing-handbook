  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title" x="34" y="52">零失败测试的单侧 95% 错误概率上界与预定样本数 N</text>
  <text class="subtitle" x="34" y="77">精确二项反演 p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> = 1 − α<tspan dy="-4.5" font-size="74%">1/N</tspan><tspan dy="4.5">&#8203;</tspan>（α = 0.05，近乎“三倍法则” 3/N）：观测到 0 次失败不等于真实错误率为零</text>
