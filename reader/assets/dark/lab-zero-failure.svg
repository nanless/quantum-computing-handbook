  <line class="guide" x1="402" y1="306.19" x2="402" y2="434"/>
  <line class="guide" x1="535.39" y1="349.34" x2="535.39" y2="434"/>
  <circle class="c2-fill" cx="402" cy="300.19" r="5.8"/>
  <circle class="c2-fill" cx="535.39" cy="343.34" r="5.8"/>
  <rect class="c1-soft" x="436" y="190" width="212" height="46" rx="8"/>
  <text class="xsb c1-txt" x="542" y="209" text-anchor="middle">N = 1,000 次零失败</text>
  <text class="xs c1-txt" x="542" y="226" text-anchor="middle">p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> = 0.002991（约 0.299%）</text>
  <line class="c1" stroke-width="1.4" x1="454" y1="236" x2="407" y2="295.19"/>
  <rect class="c2-soft" x="498" y="264" width="174" height="46" rx="8"/>
  <text class="xsb c2-txt" x="585" y="283" text-anchor="middle">N = 2,995 次零失败</text>
  <text class="xs c2-txt" x="585" y="300" text-anchor="middle">首次压至 0.001（0.1%）以下</text>
  <line class="c2" stroke-width="1.4" x1="535.39" y1="310" x2="535.39" y2="336.34"/>
  <rect class="pill" x="704" y="154" width="252" height="326" rx="10"/>
  <text class="smb" x="720" y="177">图例与精确二项公式</text>
  <line class="c1" stroke-width="2.6" x1="720" y1="198" x2="744" y2="198"/>
  <text class="xs" x="752" y="202">零失败单侧 95% 精确上界</text>
  <line class="c2" stroke-width="2.0" stroke-dasharray="6 3" x1="720" y1="220" x2="744" y2="220"/>
  <text class="xs" x="752" y="224">目标阈值 p* = 0.001</text>
  <circle class="c2-fill" cx="732" cy="242" r="4.5"/>
  <text class="xs" x="752" y="246">关键样本量验证点</text>
  <line class="grid" x1="718" y1="260" x2="942" y2="260"/>
  <text class="xsb" x="720" y="280">(1 − p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan>)<tspan dy="-4.5" font-size="74%">N</tspan><tspan dy="4.5">&#8203;</tspan> = α （α = 0.05）</text>
  <text class="xs c1-txt" x="720" y="300">p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> = 1 − 0.05<tspan dy="-4.5" font-size="74%">1/N</tspan><tspan dy="4.5">&#8203;</tspan> ≈ 3 / N</text>
  <text class="xs" x="720" y="320">N ≥ ⌈ln(α) / ln(1 − p*)⌉</text>
  <line class="grid" x1="718" y1="336" x2="942" y2="336"/>
  <text class="xsb" x="720" y="356">常见样本量速查（0 失败）</text>
  <text class="xs" x="720" y="378">N = 100     → p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> ≈ 2.95%</text>
  <text class="xs" x="720" y="398">N = 1,000   → p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> ≈ 0.299%</text>
  <text class="xs c2-txt" x="720" y="418">N = 2,995   → p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> ≤ 0.100%</text>
  <text class="xs" x="720" y="438">N = 10,000  → p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan> ≈ 0.030%</text>
  <text class="xs" x="720" y="458">p* = 10<tspan dy="-4.5" font-size="74%">−6</tspan><tspan dy="4.5">&#8203;</tspan>   → 需 N ≥ 2,995,731</text>
  <rect class="note" x="44" y="496" width="912" height="40" rx="9"/>
  <text class="sm" x="500" y="520" text-anchor="middle">前提边界：样本数 N 须在试验前预先固定且独立同分布；反复凑“连续零失败”区间再套用公式将破坏 95% 覆盖保证。</text>
</svg>
