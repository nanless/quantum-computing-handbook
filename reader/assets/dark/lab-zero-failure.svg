  <text class="sm" x="112" y="438" text-anchor="end">10<tspan dy="-4.5" font-size="74%">-4</tspan><tspan dy="4.5">&#8203;</tspan></text>
  <line class="grid" x1="122" y1="343.33" x2="682" y2="343.33"/>
  <text class="sm" x="112" y="347.33" text-anchor="end">10<tspan dy="-4.5" font-size="74%">-3</tspan><tspan dy="4.5">&#8203;</tspan></text>
  <line class="grid" x1="122" y1="252.67" x2="682" y2="252.67"/>
  <text class="sm" x="112" y="256.67" text-anchor="end">10<tspan dy="-4.5" font-size="74%">-2</tspan><tspan dy="4.5">&#8203;</tspan></text>
  <line class="grid" x1="122" y1="162" x2="682" y2="162"/>
  <text class="sm" x="112" y="166" text-anchor="end">10<tspan dy="-4.5" font-size="74%">-1</tspan><tspan dy="4.5">&#8203;</tspan></text>
  <line class="grid" x1="122" y1="162" x2="122" y2="434"/>
  <text class="sm" x="122" y="453" text-anchor="middle">100</text>
  <line class="grid" x1="255.59" y1="162" x2="255.59" y2="434"/>
  <text class="sm" x="255.59" y="453" text-anchor="middle">300</text>
