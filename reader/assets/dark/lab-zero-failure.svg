<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">零失败测试的单侧 95% 错误概率上界与预定样本数 N</title>
  <desc id="desc">双对数坐标精确绘制独立同分布试验观测到 0 次失败时的单侧 95% 错误概率上界 p_U = 1 − 0.05^(1/N)（N ∈ [100, 10000]），并标出目标门槛 p* = 0.001 以及两个关键里程碑：N = 1,000 时 p_U ≈ 0.299%，须至 N = 2,995 才首次压至 0.1% 以下。</desc>
