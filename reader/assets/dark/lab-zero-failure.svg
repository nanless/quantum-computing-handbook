  <text class="sm" x="402" y="453" text-anchor="middle">1,000</text>
  <line class="grid" x1="535.59" y1="162" x2="535.59" y2="434"/>
  <text class="sm" x="535.59" y="453" text-anchor="middle">3,000</text>
  <line class="grid" x1="682" y1="162" x2="682" y2="434"/>
  <text class="sm" x="682" y="453" text-anchor="middle">10,000</text>
  <line class="c2" stroke-width="2.0" stroke-dasharray="7 4" x1="122" y1="343.33" x2="682" y2="343.33"/>
  <text class="xsb c2-txt" x="136" y="336.33">目标错误率门槛 p* = 0.001（0.1%）</text>
  <line class="axis" x1="122" y1="434" x2="690" y2="434"/>
  <polygon class="axis-fill" points="690,434 682.5,437.6 682.5,430.4"/>
  <line class="axis" x1="122" y1="434" x2="122" y2="152"/>
  <polygon class="axis-fill" points="122,152 125.6,159.5 118.4,159.5"/>
  <text class="lbl" x="402" y="478" text-anchor="middle">预先固定的独立试验次数 N（对数刻度）</text>
  <text class="lbl" x="54" y="298" text-anchor="middle" transform="rotate(-90 54 298)">单侧 95% 错误概率上界 p<tspan dy="3" font-size="74%">U</tspan><tspan dy="-3">&#8203;</tspan>（对数刻度）</text>
