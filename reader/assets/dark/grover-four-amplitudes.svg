<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">四项 Grover 搜索的一次迭代：标记翻转符号，扩散绕平均值反射</title>
  <desc id="desc">按 00、01、10、11 顺序绘出无量纲概率振幅。初态四项均为二分之一；oracle 仅使目标 11 变成负二分之一；这时平均振幅为四分之一，扩散后前三项都为零，11 为一。纵轴是振幅而非概率，负振幅位于零线以下。</desc>
  <style>
    .bg{fill:#f7faf6}.card{fill:#fffefa;stroke:#c7d8ca;stroke-width:2}.ink{fill:#1e4238}.muted{fill:#5d7265}.rule{stroke:#809e88;stroke-width:2}.bar{fill:#5a9c79}.negative{fill:#b5664d}.onneg{fill:#fff}.final{fill:#377d68}.arrow{stroke:#47785c;stroke-width:3;fill:none;marker-end:url(#arrowhead)}.arrowhead{fill:#47785c}.head{font:600 25px 'PingFang SC',system-ui,sans-serif}.label{font:600 19px 'PingFang SC',system-ui,sans-serif}.body{font:17px 'PingFang SC',system-ui,sans-serif}.small{font:15px 'PingFang SC',system-ui,sans-serif}.number{font:600 18px 'SFMono-Regular',Consolas,monospace}
    
.bg{fill:#152620}.card{fill:#1b3027;stroke:#678b73}.ink{fill:#eaf5ec}.muted{fill:#bad0c1}.rule{stroke:#a4c5ac}.bar{fill:#83c5a0}.negative{fill:#df9c7f}.final{fill:#9dddb4}.arrow{stroke:#a5d7b2}.arrowhead{fill:#a5d7b2}

  </style>
  <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10Z"/></marker></defs>
  <rect class="bg" width="1120" height="510" rx="20"/>
  <text class="head ink" x="35" y="46">只标记 11：一轮 Grover 迭代怎样改动四个振幅</text>
  <text class="small muted" x="35" y="75">横向：位串；纵向：振幅（无量纲）。零线以下是负振幅，并非负概率。</text>

  <rect class="card" x="35" y="105" width="320" height="343" rx="15"/>
  <text class="label ink" x="55" y="137">① 初始均匀叠加</text>
  <text class="body muted" x="55" y="163">四条路径各为 +1/2</text>
  <path class="rule" d="M65 330H335"/>
  <text class="small muted" x="49" y="335">0</text>
  <rect class="bar" x="82" y="260" width="37" height="70" rx="4"/><rect class="bar" x="145" y="260" width="37" height="70" rx="4"/><rect class="bar" x="208" y="260" width="37" height="70" rx="4"/><rect class="bar" x="271" y="260" width="37" height="70" rx="4"/>
  <text class="number ink" x="100" y="250" text-anchor="middle">1/2</text><text class="number ink" x="163" y="250" text-anchor="middle">1/2</text><text class="number ink" x="226" y="250" text-anchor="middle">1/2</text><text class="number ink" x="289" y="250" text-anchor="middle">1/2</text>
  <text class="number ink" x="100" y="425" text-anchor="middle">00</text><text class="number ink" x="163" y="425" text-anchor="middle">01</text><text class="number ink" x="226" y="425" text-anchor="middle">10</text><text class="number ink" x="289" y="425" text-anchor="middle">11</text>

  <path class="arrow" d="M362 275H394"/>
  <rect class="card" x="400" y="105" width="320" height="343" rx="15"/>
  <text class="label ink" x="420" y="137">② oracle 标记目标</text>
  <text class="body muted" x="420" y="163">11 改号；平均值 μ = 1/4</text>
  <path class="rule" d="M430 330H700"/>
  <text class="small muted" x="414" y="335">0</text>
  <rect class="bar" x="447" y="260" width="37" height="70" rx="4"/><rect class="bar" x="510" y="260" width="37" height="70" rx="4"/><rect class="bar" x="573" y="260" width="37" height="70" rx="4"/><rect class="negative" x="636" y="330" width="37" height="70" rx="4"/>
  <text class="number ink" x="465" y="250" text-anchor="middle">1/2</text><text class="number ink" x="528" y="250" text-anchor="middle">1/2</text><text class="number ink" x="591" y="250" text-anchor="middle">1/2</text><text class="number onneg" x="654" y="370" text-anchor="middle">−1/2</text>
  <text class="number ink" x="465" y="425" text-anchor="middle">00</text><text class="number ink" x="528" y="425" text-anchor="middle">01</text><text class="number ink" x="591" y="425" text-anchor="middle">10</text><text class="number ink" x="654" y="425" text-anchor="middle">11</text>

  <path class="arrow" d="M727 275H759"/>
  <rect class="card" x="765" y="105" width="320" height="343" rx="15"/>
  <text class="label ink" x="785" y="137">③ 扩散：a → 2μ − a</text>
  <text class="body muted" x="785" y="163">前三项归零，11 变成 +1</text>
  <path class="rule" d="M795 330H1065"/>
  <text class="small muted" x="779" y="335">0</text>
  <rect class="final" x="1001" y="190" width="37" height="140" rx="4"/>
  <text class="number ink" x="830" y="315" text-anchor="middle">0</text><text class="number ink" x="893" y="315" text-anchor="middle">0</text><text class="number ink" x="956" y="315" text-anchor="middle">0</text><text class="number ink" x="1019" y="180" text-anchor="middle">1</text>
  <text class="number ink" x="830" y="425" text-anchor="middle">00</text><text class="number ink" x="893" y="425" text-anchor="middle">01</text><text class="number ink" x="956" y="425" text-anchor="middle">10</text><text class="number ink" x="1019" y="425" text-anchor="middle">11</text>
  <text class="small muted" x="35" y="485">测量概率要对最终振幅取模平方；本例 11 的概率为 1，其余三个结果为 0。图不表示一般 N、M 都只需一轮。</text>
</svg>
