<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">带负谱非网格 HHL 有限相位误差与 16 顶点离散量子行走搜索</title>
  <desc id="desc">三联科学图基于本地精确模拟归档数据：左图对比非网格带负特征值 (−1.1, 2.3) 的 HHL 线路在相位寄存器位数 t = 3..6 下仅选标志位与同时要求相位归零两类成功概率；中图展示条件混态根保真度与残留非零相位垃圾占比；右图展示 4 维超立方体（16 顶点）SKW 离散量子行走的标记顶点概率，在第 4 步达最早峰值 25/64，第 8 步过步回落至 1/256。</desc>
