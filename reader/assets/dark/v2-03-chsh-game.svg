<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">CHSH 合作博弈规则、最优测量角与赢率上限对比</title>
  <desc id="desc">左面板展示 CHSH 合作博弈流程（裁判向隔绝的 Alice、Bob 发随机比特 x, y，赢条件 a ⊕ b = x·y）及量子最优策略的四组 Bloch x–z 测量轴（Alice 取 0 与 π/2，Bob 取 +π/4 与 −π/4）。右面板以精确柱状图对比随机猜 50.00%（S=0）、经典局域隐变量上限 75.00%（S=2）与共享 Bell 态量子策略 cos²(π/8) ≈ 85.36%（Tsirelson 界 S = 2√2）。</desc>
