name: Diagnose Linux PDF typography

on: workflow_dispatch

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "tools/reader/package-lock.json"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tools/reader/package-lock.json') }}

      - name: Install reader, CJK font, zip/unzip, and PDF dependencies
        run: |
          npm ci --prefix tools/reader --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei zip unzip
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npm exec --prefix tools/reader -- playwright install --with-deps chromium
          else
            npm exec --prefix tools/reader -- playwright install-deps chromium
          fi
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/reader/requirements-pdf.txt

      - name: Reproduce the PDF output and font gate
        id: pdf
        env:
          PDF_PRINT_CONCURRENCY: "2"
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-run"
          rm -f dist/quantum-computing-handbook.pdf work/research/pdf-build-report.json
          status=0
          /usr/bin/time -v node tools/reader/build-pdf.mjs || status=$?
          for file in dist/quantum-computing-handbook.pdf work/research/pdf-build-report.json; do
            if [ -f "$file" ]; then
              cp "$file" "$RUNNER_TEMP/pdf-run/"
            fi
          done
          exit "$status"

      - name: Retain the freshly built PDF and QA report
        if: ${{ always() && steps.pdf.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-pdf-diagnostics
          path: ${{ runner.temp }}/pdf-run
          if-no-files-found: error
          retention-days: 3
