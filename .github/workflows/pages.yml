name: Deploy Reader to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "handbook/**"
      - "tools/reader/**"
      - "codes/**"
      - "dist/**"
      - "work/research/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "tools/reader/package-lock.json"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tools/reader/package-lock.json') }}

      - name: Install reader dependencies, CJK fonts, and Chromium
        run: |
          npm ci --prefix tools/reader --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npm exec --prefix tools/reader -- playwright install --with-deps chromium
          else
            npm exec --prefix tools/reader -- playwright install-deps chromium
          fi

      - name: Run offline stdlib experiments and integrity checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 codes/run_all.py

      - name: Run manuscript quality, examples, and review gates
        run: |
          node tools/reader/check-v3-quality.mjs
          node tools/reader/check-qm-examples.mjs
          node tools/reader/check-qm-review.mjs
          node tools/reader/check-network-examples.mjs

      - name: Build offline-first reader
        run: node tools/reader/build.mjs

      - name: Verify reader layout, formulas, SVG, and interactive lab
        run: node tools/reader/verify.mjs

      - name: Stage GitHub Pages artifact
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          rm -rf _pages
          mkdir -p _pages _pages/dist
          cp -a reader/. _pages/
          find _pages -path '*/vendor' -prune -o -type d -name '__pycache__' -prune -exec rm -rf {} +
          find _pages -path '*/vendor' -prune -o -type f \( -name '*.pyc' -o -name '.DS_Store' \) -exec rm -f {} +
          rm -rf _pages/research _pages/STYLE.html
          touch _pages/.nojekyll

          for f in dist/*.pdf; do
            cp -a "$f" _pages/dist/
          done
          for f in dist/*.epub; do
            cp -a "$f" _pages/dist/
          done

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const repo = process.env.GITHUB_REPOSITORY || "";
            const releaseUrl = repo ? `https://github.com/${repo}/releases/latest` : "";
            const files = fs.readdirSync("_pages/dist")
              .filter(f => /\.(pdf|epub)$/i.test(f))
              .sort();
            const rows = files.map(f => {
              const mb = (fs.statSync(path.join("_pages/dist", f)).size / (1024 * 1024)).toFixed(2);
              const kind = f.endsWith(".pdf") ? "A4 印刷级合订本 PDF" : "原生 MathML 3 EPUB 3 电子书";
              return `<li><a href="./${f}">${f}</a> <span>(${kind} · ${mb} MiB)</span></li>`;
            }).join("\n");
            const listBlock = files.length
              ? `<section class="card"><h2>本站托管的离线出版物</h2><ul>\n${rows}\n</ul></section>`
              : "";
            const releaseBlock = releaseUrl
              ? `<section class="card"><h2>GitHub Releases 完整离线发行包</h2><p>全部 5 类带 SHA-256 校验清单（<code>SHA256SUMS.txt</code>）的官方发行产物均托管在 GitHub Releases（最新版与历史归档长期可下载）：</p><ul><li><a href="${releaseUrl}/download/quantum-computing-handbook.pdf" rel="noopener noreferrer">直接下载 A4 印刷级合订本 PDF (quantum-computing-handbook.pdf) ↗</a></li><li><a href="${releaseUrl}/download/quantum-computing-handbook.epub" rel="noopener noreferrer">直接下载原生 MathML 3 电子书 EPUB 3 (quantum-computing-handbook.epub) ↗</a></li><li><a href="${releaseUrl}/download/SHA256SUMS.txt" rel="noopener noreferrer">下载 SHA256SUMS.txt 完整性校验清单 ↗</a></li><li><a href="${releaseUrl}" rel="noopener noreferrer">前往 GitHub Releases 查看全部 5 类产物（含整站离线阅读版 ZIP 与自编离线代码复算包 ZIP）↗</a></li></ul></section>`
              : "";
            const html = `<!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314453d'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23fbfaf6'%3E%CF%88%3C/text%3E%3C/svg%3E">
          <title>电子书与离线包下载 · 量子计算手册</title>
          <style>body{font-family:"Noto Sans CJK SC",system-ui,-apple-system,sans-serif;max-width:780px;margin:48px auto;padding:0 20px;line-height:1.75;color:#1b2b27;background:#fbfaf6}a{color:#14453d;font-weight:600}li{margin:10px 0}.card{margin:24px 0;padding:18px 22px;border:1px solid #d7d1c5;border-radius:10px;background:#f3efe6}h2{margin-top:0;font-size:1.15rem}code{background:#e9e3d7;padding:2px 6px;border-radius:4px;font-size:0.9em}</style>
          </head><body>
          <h1>量子计算手册 · 电子书与离线包下载</h1>
          <p>《量子计算手册》除在线阅读版外，同时提供印刷级 A4 PDF、原生 MathML 3 EPUB 3、零依赖整站离线 ZIP 与自编离线复算代码包。</p>
          ${listBlock}
          ${releaseBlock}
          <p><a href="../index.html">← 返回在线阅读版首页</a></p>
          </body></html>\n`;
            fs.writeFileSync("_pages/dist/index.html", html);
          '

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_pages"

  deploy:
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
