<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">数据处理不等式（DPI）总枢纽：熵族、强次可加性与信道容量主链</title>
  <desc id="desc">左面板展示以夹心量子 Rényi 散度广义数据处理不等式（DPI）为总枢纽的逻辑主链：由 α=1/2、α→1 与 α→∞ 三分支分别导出根保真度单调、Umegaki 相对熵 D(ρ‖σ) 与互信息 I(A:B)、强次可加性 SSA、Holevo 界 χ、量子 Pinsker 界及有限长最小熵，并向上衔接第 18 章四类信道容量。右面板以精确 Python 计算绘制单比特退极化信道 ε_p 下 Holevo χ(p)、最优 Helstrom 互信息 I(X:Y)、相对熵 D(ε_p(ρ)‖I/2) 与 Pinsker 下界随噪声 p ∈ [0,1] 的单调收缩曲线。</desc>
