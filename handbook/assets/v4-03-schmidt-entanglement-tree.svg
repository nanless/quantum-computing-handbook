  <text class="smb c3-txt" x="570" y="196" text-anchor="middle">纯态分支（一步充要）</text>
  <text class="xsb" x="570" y="216" text-anchor="middle">Schmidt 秩 r / ad−bc</text>
  <text class="xs" x="570" y="236" text-anchor="middle">r ≥ 2 ⇔ S(ρ_A) &gt; 0</text>
  <text class="xs c3-txt" x="570" y="256" text-anchor="middle">2×2 等价于 2|ad−bc|&gt;0</text>
