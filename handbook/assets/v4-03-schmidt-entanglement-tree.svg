  <text class="smb" x="34" y="245" transform="rotate(-90 34 245)" text-anchor="middle">奇异值 sᵢ / 纠缠熵 S (ebit)</text>
  <line class="guide" x1="261.0" y1="138.0" x2="261.0" y2="275"/>
