<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">双比特 Schmidt 分解曲线与混态纠缠判据决策树</title>
  <desc id="desc">左面板绘出双比特纯态 |ψ(θ)⟩ = cosθ|00⟩ + sinθ|11⟩ 的 Schmidt 奇异值 (cosθ, sinθ) 与纠缠熵 S(ρ_A) 实算曲线，在 θ=π/4 达最大纠缠 1 ebit；右面板整合纯态与混态纠缠判据决策树，分别列出 PPT、固定纠缠见证和 Bell 检验的条件，并单列非局域、可导引与纠缠的物理层级。</desc>
