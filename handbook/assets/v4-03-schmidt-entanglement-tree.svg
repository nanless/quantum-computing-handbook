  <text class="xsb c2-txt" x="261" y="293" text-anchor="middle">θ = π/4（最大纠缠 Bell 态）</text>
  <text class="xs" x="261" y="311" text-anchor="middle">s₀ = s₁ = 1/√2 ≈ 0.707</text>
  <text class="xsb c3-txt" x="261" y="329" text-anchor="middle">S(ρ_A) = 1.00 ebit，r = 2</text>
  <rect class="note" x="34.0" y="404.0" width="416.0" height="30.0" rx="8"/>
  <text class="xsb" x="242.0" y="423.2" text-anchor="middle">纯态充要：Schmidt 秩 r = 2 ⇔ S(ρ_A) &gt; 0；混态中 S(ρ_A) 失效！</text>
