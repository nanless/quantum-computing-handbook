  <text class="xs c4-txt" x="504" y="342">⊂ EPR 可导引</text>
  <text class="xs c1-txt" x="504" y="360">⊂ 量子纠缠</text>
  <text class="xs c3-txt" x="504" y="378">例：两比特 Werner 态</text>
