<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc">
<title id="title">等间隔与非等间隔能级对频率选择的影响</title><desc id="desc">左侧谐振子的前三个能级等间隔，相邻跃迁频率相同。右侧示意非谐系统，零到一和一到二的能级差不同，可在合适驱动条件下区别寻址。图仅示意能量顺序和相等关系，不是器件测量数据，未画所有能级。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.bg{fill:#f7faf5}.ink{fill:#203e36}.muted{fill:#586f64}.panel{fill:#edf3e9;stroke:#c4d4c4}.box{fill:#fff2db;stroke:#b58c43;stroke-width:2}.line{stroke:#34765b;stroke-width:3;fill:none}.accent{stroke:#80639c;stroke-width:3;fill:none;stroke-dasharray:9 6}.axis{stroke:#73897d;stroke-width:1.5;fill:none}.title{font-size:27px;font-weight:600}.body{font-size:21px}.small{font-size:18px}.label{font-size:23px;font-weight:600}@media(prefers-color-scheme:dark){.bg{fill:#172820}.ink{fill:#eaf5ed}.muted{fill:#bacfc0}.panel{fill:#20392c;stroke:#52715c}.box{fill:#433824;stroke:#c9a262}.line{stroke:#a9d7ba}.accent{stroke:#d1b6ef}.axis{stroke:#98b7a3}}</style>
<rect class="bg" width="1100" height="555" rx="20"/>
<text class="title ink" x="32" y="45">能级间距不同，才有机会按频率区分跃迁</text>
<text class="small muted" x="32" y="79">示意图，非等比例；仅画前三个能级。频率可分辨仍不保证驱动没有泄漏。</text>
<rect class="panel" x="35" y="112" width="490" height="370" rx="14"/><rect class="panel" x="575" y="112" width="490" height="370" rx="14"/>
<text class="label ink" x="75" y="150">理想谐振子</text><text class="label ink" x="615" y="150">非谐系统示例</text>
<path class="axis" d="M92 432V181M82 194l10-13 10 13M632 432V181M622 194l10-13 10 13"/>
<text class="small muted" x="55" y="206">能量</text><text class="small muted" x="595" y="206">能量</text>
<path class="line" d="M145 413H330M145 308H330M145 203H330M685 413H870M685 288H870M685 213H870"/>
<text class="body ink" x="115" y="420">0</text><text class="body ink" x="115" y="315">1</text><text class="body ink" x="115" y="210">2</text>
<text class="body ink" x="655" y="420">0</text><text class="body ink" x="655" y="295">1</text><text class="body ink" x="655" y="220">2</text>
<path class="axis" d="M355 413V308M346 320l9-12 9 12M355 308V203M346 215l9-12 9 12M895 413V288M886 300l9-12 9 12M895 288V213M886 225l9-12 9 12"/>
<text class="body ink" x="375" y="366">ℏω</text><text class="body ink" x="375" y="261">ℏω</text>
<text class="body ink" x="915" y="357">ℏω₀₁</text><text class="body ink" x="915" y="259">ℏω₁₂</text>
<text class="small muted" x="140" y="457">相邻跃迁频率相同</text><text class="small muted" x="680" y="457">ω₀₁ ≠ ω₁₂</text>
<text class="small muted" x="35" y="518">脉冲的频率范围、强度、持续时间和跃迁矩阵元，都影响能否只控制所选的两个能级。</text></svg>
