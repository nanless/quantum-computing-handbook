<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">二维颜色码几何与偏置噪声 XZZX 表面码对角线重复链</title>
  <desc id="desc">左面板对比 d=3 Steane [[7,1,3]] 与 d=5 [[19,1,5]] 三角颜色码的红绿蓝三着色面元及内部三色超边结构；右面板展示奇数位施加 Hadamard 后的 d=3 旋转 XZZX 表面码，中心 Z₅ 错仅点亮 45° 对角线两面元，纯 Z 偏置下解耦为 1D 对角线重复链并将码容量阈值推至 50%。</desc>
