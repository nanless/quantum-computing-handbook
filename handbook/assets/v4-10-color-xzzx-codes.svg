  <rect class="bg" width="960" height="460" rx="16"/>
  <text class="title" x="22" y="34">二维三角颜色码三色面元与偏置噪声 XZZX 表面码对角线重复链</text>
  <text class="subtitle" x="22" y="54">左：d = 3 Steane [[7,1,3]] 与 d = 5 [[19,1,5]] 三角色码及三色超边；右：XZZX 表面码纯 Z 错解耦为 1D 对角重复链</text>
  <rect class="panel" x="20.0" y="68.0" width="460.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 32.0 69.0 H 468.0 Q 479.0 69.0 479.0 80.0 V 99.0 H 21.0 V 80.0 Q 21.0 69.0 32.0 69.0 Z"/>
  <line class="grid" x1="21.0" y1="99.0" x2="479.0" y2="99.0"/>
  <text class="sec" x="33.0" y="89.5">1. 二维三角颜色码：d = 3 (Steane) 与 d = 5 ([[19,1,5]])</text>
  <text class="smb c3-txt" x="116" y="124" text-anchor="middle">d = 3 Steane [[7, 1, 3]]</text>
  <text class="xs" x="116" y="141" text-anchor="middle">3 面元（全权重 4）</text>
  <polygon class="cc-r" points="116.0,172.0 139.1,212.0 116.0,252.0 69.8,252.0"/>
  <polygon class="cc-b" points="116.0,252.0 139.1,212.0 185.3,292.0 139.1,292.0"/>
  <polygon class="cc-g" points="69.8,252.0 116.0,252.0 139.1,292.0 46.7,292.0"/>
  <circle class="qnode" cx="116.0" cy="172.0" r="4.8"/>
  <circle class="qnode" cx="139.1" cy="212.0" r="4.8"/>
  <circle class="qnode" cx="69.8" cy="252.0" r="4.8"/>
  <circle class="qnode-err" cx="116.0" cy="252.0" r="6.2"/>
  <circle class="qnode" cx="46.7" cy="292.0" r="4.8"/>
  <circle class="qnode" cx="139.1" cy="292.0" r="4.8"/>
  <circle class="qnode" cx="185.3" cy="292.0" r="4.8"/>
  <line class="grid" stroke-dasharray="4 4" x1="214" y1="112" x2="214" y2="318"/>
  <text class="smb c3-txt" x="344" y="124" text-anchor="middle">d = 5 三角色码 [[19, 1, 5]]</text>
  <text class="xs" x="344" y="141" text-anchor="middle">6 边界权重 4 + 3 内部权重 6</text>
  <polygon class="cc-b" points="344.0,152.0 359.6,179.0 344.0,206.0 312.8,206.0"/>
  <polygon class="cc-g" points="344.0,206.0 359.6,179.0 390.8,233.0 359.6,233.0"/>
  <polygon class="cc-r" points="312.8,206.0 344.0,206.0 359.6,233.0 344.0,260.0 312.8,260.0 297.2,233.0"/>
  <polygon class="cc-b" points="359.6,233.0 390.8,233.0 406.4,260.0 390.8,287.0 359.6,287.0 344.0,260.0"/>
  <polygon class="cc-g" points="390.8,287.0 406.4,260.0 437.5,314.0 406.4,314.0"/>
  <polygon class="cc-b" points="297.2,233.0 312.8,260.0 297.2,287.0 266.1,287.0"/>
  <polygon class="cc-g" points="312.8,260.0 344.0,260.0 359.6,287.0 344.0,314.0 312.8,314.0 297.2,287.0"/>
  <polygon class="cc-r" points="359.6,287.0 390.8,287.0 406.4,314.0 344.0,314.0"/>
  <polygon class="cc-r" points="266.1,287.0 297.2,287.0 312.8,314.0 250.5,314.0"/>
  <circle class="qnode" cx="344.0" cy="152.0" r="4.2"/>
  <circle class="qnode" cx="359.6" cy="179.0" r="4.2"/>
  <circle class="qnode" cx="312.8" cy="206.0" r="4.2"/>
  <circle class="qnode" cx="344.0" cy="206.0" r="4.2"/>
  <circle class="qnode" cx="297.2" cy="233.0" r="4.2"/>
  <circle class="qnode" cx="359.6" cy="233.0" r="4.2"/>
  <circle class="qnode" cx="390.8" cy="233.0" r="4.2"/>
  <circle class="qnode" cx="312.8" cy="260.0" r="4.2"/>
  <circle class="qnode-err" cx="344.0" cy="260.0" r="5.6"/>
  <circle class="qnode" cx="406.4" cy="260.0" r="4.2"/>
  <circle class="qnode" cx="266.1" cy="287.0" r="4.2"/>
  <circle class="qnode" cx="297.2" cy="287.0" r="4.2"/>
  <circle class="qnode" cx="359.6" cy="287.0" r="4.2"/>
  <circle class="qnode" cx="390.8" cy="287.0" r="4.2"/>
  <circle class="qnode" cx="250.5" cy="314.0" r="4.2"/>
  <circle class="qnode" cx="312.8" cy="314.0" r="4.2"/>
  <circle class="qnode" cx="344.0" cy="314.0" r="4.2"/>
  <circle class="qnode" cx="406.4" cy="314.0" r="4.2"/>
  <circle class="qnode" cx="437.5" cy="314.0" r="4.2"/>
  <rect class="subpanel" x="34" y="328" width="432" height="66" rx="9"/>
  <rect class="cc-r" x="46" y="339" width="14" height="12" rx="2"/>
  <rect class="cc-g" x="65" y="339" width="14" height="12" rx="2"/>
  <rect class="cc-b" x="84" y="339" width="14" height="12" rx="2"/>
  <text class="xsb" x="106" y="349">红/绿/蓝面元各载 X 与 Z 稳定子（H_X = H_Z 自对偶）</text>
  <circle class="qnode-err" cx="53" cy="368" r="4.8"/>
  <text class="xs c2-txt" x="66" y="372">内部单比特错同时点亮 3 色面元（超边，需 Chromobius 解码）</text>
  <text class="xs c3-txt" x="46" y="388">比特密度 (3d²+1)/4 省 ~25%；全 Clifford 横向（逻辑 S = (S†)⊗ⁿ）</text>
  <rect class="note" x="34.0" y="404.0" width="432.0" height="30.0" rx="8"/>
  <text class="xsb" x="250.0" y="423.2" text-anchor="middle">二维颜色码以权重 6 校验与超边解码为代价，换取全 Clifford 群横向能力</text>
  <rect class="panel" x="492.0" y="68.0" width="448.0" height="376.0" rx="12.0"/>
  <path class="phead" d="M 504.0 69.0 H 928.0 Q 939.0 69.0 939.0 80.0 V 99.0 H 493.0 V 80.0 Q 493.0 69.0 504.0 69.0 Z"/>
  <line class="grid" x1="493.0" y1="99.0" x2="939.0" y2="99.0"/>
  <text class="sec" x="505.0" y="89.5">2. 偏置噪声 XZZX 表面码：纯 Z 错解耦为 1D 对角链</text>
  <path class="pill" d="M 542 148 A 36 22 0 0 1 614 148 Z"/>
  <text class="xs" x="578" y="142" text-anchor="middle">Z₁X₂</text>
  <path class="pill" d="M 614 292 A 36 22 0 0 0 686 292 Z"/>
  <text class="xs" x="650" y="308" text-anchor="middle">X₈Z₉</text>
  <path class="pill" d="M 686 148 A 22 36 0 0 1 686 220 Z"/>
  <text class="xs" x="697" y="188" text-anchor="middle">XZ</text>
  <path class="pill" d="M 542 220 A 22 36 0 0 0 542 292 Z"/>
  <text class="xs" x="531" y="260" text-anchor="middle">ZX</text>
  <polygon class="cc-r" points="542,148 614,148 614,220 542,220"/>
  <polygon class="cc-b" points="614,148 686,148 686,220 614,220"/>
  <polygon class="cc-b" points="542,220 614,220 614,292 542,292"/>
  <polygon class="cc-r" points="614,220 686,220 686,292 614,292"/>
  <line class="c2" stroke-width="2.6" stroke-dasharray="5 4" x1="542" y1="148" x2="686" y2="292"/>
  <line class="c3" stroke-width="2.0" stroke-dasharray="5 4" x1="614" y1="148" x2="686" y2="220"/>
  <line class="c3" stroke-width="2.0" stroke-dasharray="5 4" x1="542" y1="220" x2="614" y2="292"/>
  <text class="xsb c2-txt" x="569" y="164" text-anchor="middle">X</text>
  <text class="xsb c1-txt" x="600" y="168" text-anchor="middle">Z</text>
  <text class="xsb c1-txt" x="556" y="210" text-anchor="middle">Z</text>
  <text class="xsb c2-txt" x="587" y="214" text-anchor="middle">X</text>
  <circle class="c2-fill" cx="578" cy="184" r="11"/>
  <text class="badge-txt" x="578" y="188" text-anchor="middle">−1</text>
  <text class="xsb c2-txt" x="641" y="164" text-anchor="middle">X</text>
  <text class="xsb c1-txt" x="672" y="168" text-anchor="middle">Z</text>
  <text class="xsb c1-txt" x="628" y="210" text-anchor="middle">Z</text>
  <text class="xsb c2-txt" x="659" y="214" text-anchor="middle">X</text>
  <text class="xsb c2-txt" x="569" y="236" text-anchor="middle">X</text>
  <text class="xsb c1-txt" x="600" y="240" text-anchor="middle">Z</text>
  <text class="xsb c1-txt" x="556" y="282" text-anchor="middle">Z</text>
  <text class="xsb c2-txt" x="587" y="286" text-anchor="middle">X</text>
  <text class="xsb c2-txt" x="641" y="236" text-anchor="middle">X</text>
  <text class="xsb c1-txt" x="672" y="240" text-anchor="middle">Z</text>
  <text class="xsb c1-txt" x="628" y="282" text-anchor="middle">Z</text>
  <text class="xsb c2-txt" x="659" y="286" text-anchor="middle">X</text>
  <circle class="c2-fill" cx="650" cy="256" r="11"/>
  <text class="badge-txt" x="650" y="260" text-anchor="middle">−1</text>
  <circle class="qnode" cx="542" cy="148" r="10.5"/>
  <text class="xsb" x="542" y="152" text-anchor="middle">1</text>
  <circle class="qnode" cx="614" cy="148" r="10.5"/>
  <text class="xsb" x="614" y="152" text-anchor="middle">2</text>
  <circle class="qnode" cx="686" cy="148" r="10.5"/>
  <text class="xsb" x="686" y="152" text-anchor="middle">3</text>
  <circle class="qnode" cx="542" cy="220" r="10.5"/>
  <text class="xsb" x="542" y="224" text-anchor="middle">4</text>
  <circle class="qnode-err" cx="614" cy="220" r="12.5"/>
  <text class="badge-txt" x="614" y="224" text-anchor="middle">Z₅</text>
  <circle class="qnode" cx="686" cy="220" r="10.5"/>
  <text class="xsb" x="686" y="224" text-anchor="middle">6</text>
  <circle class="qnode" cx="542" cy="292" r="10.5"/>
  <text class="xsb" x="542" y="296" text-anchor="middle">7</text>
  <circle class="qnode" cx="614" cy="292" r="10.5"/>
  <text class="xsb" x="614" y="296" text-anchor="middle">8</text>
  <circle class="qnode" cx="686" cy="292" r="10.5"/>
  <text class="xsb" x="686" y="296" text-anchor="middle">9</text>
  <rect class="c2-soft" x="726" y="114" width="202" height="104" rx="9"/>
  <text class="xsb c2-txt" x="738" y="133">纯 Z 错解耦机制（d = 3）</text>
  <text class="xs" x="738" y="152">奇数位 {1,3,5,7,9} 施 H，</text>
  <text class="xs" x="738" y="169">内部稳定子全变 XZZX 面元。</text>
  <text class="xs" x="738" y="187">Z₅ 仅点亮 NW/SE 对角两面</text>
  <text class="xsb c2-txt" x="738" y="206">（与 NE/SW 面元严格对易）</text>
  <rect class="c3-soft" x="726" y="226" width="202" height="104" rx="9"/>
  <text class="xsb c3-txt" x="738" y="245">1D 对角重复链与 50% 阈值</text>
  <text class="xs" x="738" y="264">纯 Z 偏置（η = p_Z/p_X → ∞）</text>
  <text class="xs" x="738" y="282">将二维格解耦为 d 条 45° 链：</text>
  <text class="xsb c3-txt" x="738" y="301">码容量阈值飙升至 50%</text>
  <text class="xs" x="738" y="319">（常规去极化表面码 ~10.9%）</text>
  <rect class="subpanel" x="506" y="340" width="422" height="54" rx="9"/>
  <text class="xsb c1-txt" x="518" y="359">硬前提——偏置保持门（Bias-Preserving Gates）：</text>
  <text class="xs" x="518" y="379">校验门电路不得将 Z 错转化为 X 错（如猫态比特 CX），否则高阈值瓦解</text>
  <rect class="note" x="506.0" y="404.0" width="422.0" height="30.0" rx="8"/>
  <text class="xsb" x="717.0" y="423.2" text-anchor="middle">纯 Z 偏置下 XZZX 表面码解耦为 1D 对角重复链，码容量阈值逼近 50%</text>
</svg>
