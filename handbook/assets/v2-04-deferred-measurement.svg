  <path class="axis" stroke-width="1.6" d="M 827.13 421.5 L 826.34 419.91 L 825.33 418.45 L 824.11 417.15 L 822.71 416.05 L 821.17 415.17 L 819.51 414.52 L 817.77 414.13 L 816 414 L 814.23 414.13 L 812.49 414.52 L 810.83 415.17 L 809.29 416.05 L 807.89 417.15 L 806.67 418.45 L 805.66 419.91 L 804.87 421.5"/>
  <line class="c2" stroke-width="1.8" x1="816" y1="426" x2="826.5" y2="411"/>
  <polygon class="c2-fill" points="826.5,411 825.6,416.47 821.67,413.72"/>
  <text class="xs c3-txt" x="831" y="431" text-anchor="end">Z</text>
  <line class="cwire" x1="836" y1="415.4" x2="878" y2="415.4"/>
  <line class="cwire" x1="836" y1="420.6" x2="878" y2="420.6"/>
  <text class="sm" x="886" y="422">k</text>
  <line class="wire" x1="610" y1="468" x2="681" y2="468"/>
  <line class="wire" x1="727" y1="468" x2="878" y2="468"/>
  <rect class="c1-soft" x="681" y="450" width="46" height="36" rx="6"/>
  <text class="gate-txt" x="704" y="474" text-anchor="middle">U</text>
  <text class="xs" x="884" y="465">U<tspan baseline-shift="super" font-size="72%">k</tspan>|ψ<tspan dy="3" font-size="75%">k</tspan><tspan dy="-3">&#8203;</tspan>⟩</text>
  <text class="xs" x="884" y="481">(归一条件态)</text>
  <rect class="note" x="42" y="500" width="916" height="44" rx="9"/>
  <text class="xs" x="500" y="517" text-anchor="middle">初态 √p<tspan dy="3" font-size="75%">0</tspan><tspan dy="-3">&#8203;</tspan>|0⟩|ψ<tspan dy="3" font-size="75%">0</tspan><tspan dy="-3">&#8203;</tspan>⟩ + √p<tspan dy="3" font-size="75%">1</tspan><tspan dy="-3">&#8203;</tspan>|1⟩|ψ<tspan dy="3" font-size="75%">1</tspan><tspan dy="-3">&#8203;</tspan>⟩（|ψ<tspan dy="3" font-size="75%">0</tspan><tspan dy="-3">&#8203;</tspan>⟩, |ψ<tspan dy="3" font-size="75%">1</tspan><tspan dy="-3">&#8203;</tspan>⟩ 归一）：两方案皆得 ρ′<tspan dy="3" font-size="75%">AB</tspan><tspan dy="-3">&#8203;</tspan> = p<tspan dy="3" font-size="75%">0</tspan><tspan dy="-3">&#8203;</tspan>|0⟩⟨0|⊗|ψ<tspan dy="3" font-size="75%">0</tspan><tspan dy="-3">&#8203;</tspan>⟩⟨ψ<tspan dy="3" font-size="75%">0</tspan><tspan dy="-3">&#8203;</tspan>| + p<tspan dy="3" font-size="75%">1</tspan><tspan dy="-3">&#8203;</tspan>|1⟩⟨1|⊗U|ψ<tspan dy="3" font-size="75%">1</tspan><tspan dy="-3">&#8203;</tspan>⟩⟨ψ<tspan dy="3" font-size="75%">1</tspan><tspan dy="-3">&#8203;</tspan>|U†</text>
  <text class="xs" x="500" y="535" text-anchor="middle">本图沿用控制位 A 保持标签。若继续操作数据位，可另设干净记录位；跨站点相干门另计通信资源。</text>
</svg>
