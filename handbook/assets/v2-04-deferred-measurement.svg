  <rect class="c1-soft" x="426" y="224" width="28" height="28" rx="5"/>
  <text class="gate-txt" x="440" y="243" text-anchor="middle">Z</text>
  <text class="xs" x="384" y="278" text-anchor="middle">|x, y⟩ ↦ (−1)ˣʸ|x, y⟩（两线对称）</text>
  <rect class="subpanel" x="506" y="144" width="220" height="150" rx="10"/>
  <text class="smb c1-txt" x="616" y="165" text-anchor="middle">SWAP（三 CNOT 交替分解）</text>
  <line class="wire" x1="518" y1="196" x2="566" y2="196"/>
  <line class="wire" x1="518" y1="238" x2="566" y2="238"/>
  <line class="wire" x1="542" y1="196" x2="542" y2="238"/>
  <line class="wire" x1="536.5" y1="190.5" x2="547.5" y2="201.5"/>
  <line class="wire" x1="536.5" y1="201.5" x2="547.5" y2="190.5"/>
  <line class="wire" x1="536.5" y1="232.5" x2="547.5" y2="243.5"/>
  <line class="wire" x1="536.5" y1="243.5" x2="547.5" y2="232.5"/>
  <text class="lblb c1-txt" x="582" y="222" text-anchor="middle">≡</text>
  <line class="wire" x1="598" y1="196" x2="716" y2="196"/>
  <line class="wire" x1="598" y1="238" x2="716" y2="238"/>
  <line class="wire" x1="618" y1="196" x2="618" y2="238"/>
  <circle class="ctrl" cx="618" cy="196" r="4.6"/>
  <circle class="targ" cx="618" cy="238" r="8.8"/>
  <line class="wire" x1="609.2" y1="238" x2="626.8" y2="238"/>
  <line class="wire" x1="618" y1="229.2" x2="618" y2="246.8"/>
  <line class="wire" x1="657" y1="238" x2="657" y2="196"/>
  <circle class="ctrl" cx="657" cy="238" r="4.6"/>
  <circle class="targ" cx="657" cy="196" r="8.8"/>
  <line class="wire" x1="648.2" y1="196" x2="665.8" y2="196"/>
  <line class="wire" x1="657" y1="187.2" x2="657" y2="204.8"/>
  <line class="wire" x1="696" y1="196" x2="696" y2="238"/>
