    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="hatch-stroke2" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <pattern id="hatch-green" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-stroke3" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <pattern id="hatch-neutral" width="7" height="7" patternUnits="userSpaceOnUse"><line class="hatch-stroke0" x1="0" y1="3.5" x2="7" y2="3.5"/></pattern>
  </defs>
  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title" x="34" y="54">多比特核心量子门与延迟测量原理</text>
  <text class="subtitle" x="34" y="79">上：CNOT、CZ、SWAP (= 3 CNOT) 与 Toffoli (CCNOT) 门符号与作用；下：控制位保留读出标签时的延迟测量</text>
  <rect class="panel" x="28" y="96" width="944" height="208" rx="14"/>
  <path class="phead" d="M 42 97 H 958 Q 971 97 971 110 V 134 H 29 V 110 Q 29 97 42 97 Z"/>
  <line class="grid" x1="29" y1="134" x2="971" y2="134"/>
  <text class="sec" x="44" y="120">多比特核心量子门：符号、恒等分解与计算基作用（时间从左到右）</text>
  <rect class="panel" x="28" y="316" width="944" height="236" rx="14"/>
  <path class="phead" d="M 42 317 H 958 Q 971 317 971 330 V 354 H 29 V 330 Q 29 317 42 317 Z"/>
  <line class="grid" x1="29" y1="354" x2="971" y2="354"/>
  <text class="sec" x="44" y="340">延迟测量原理（Principle of Deferred Measurement）：控制位保留原标签</text>
  <rect class="subpanel" x="42" y="144" width="220" height="150" rx="10"/>
  <text class="smb c1-txt" x="152" y="165" text-anchor="middle">CNOT（受控非门）</text>
