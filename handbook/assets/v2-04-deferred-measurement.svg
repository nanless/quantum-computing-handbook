  <line class="wire" x1="80" y1="238" x2="196" y2="238"/>
  <line class="wire" x1="138" y1="196" x2="138" y2="238"/>
  <circle class="ctrl" cx="138" cy="196" r="4.6"/>
  <circle class="targ" cx="138" cy="238" r="10.5"/>
  <line class="wire" x1="127.5" y1="238" x2="148.5" y2="238"/>
  <line class="wire" x1="138" y1="227.5" x2="138" y2="248.5"/>
  <text class="sm" x="72" y="200" text-anchor="end">|x⟩</text>
  <text class="sm" x="72" y="242" text-anchor="end">|y⟩</text>
  <text class="sm" x="204" y="200">|x⟩</text>
  <text class="sm" x="204" y="242">|y⊕x⟩</text>
  <text class="xs" x="152" y="278" text-anchor="middle">|x, y⟩ ↦ |x, y ⊕ x⟩</text>
  <rect class="subpanel" x="274" y="144" width="220" height="150" rx="10"/>
  <text class="smb c1-txt" x="384" y="165" text-anchor="middle">CZ（对称受控相位门）</text>
  <line class="wire" x1="298" y1="196" x2="366" y2="196"/>
  <line class="wire" x1="298" y1="238" x2="366" y2="238"/>
  <line class="wire" x1="332" y1="196" x2="332" y2="238"/>
  <circle class="ctrl" cx="332" cy="196" r="4.6"/>
  <circle class="ctrl" cx="332" cy="238" r="4.6"/>
  <text class="lblb c1-txt" x="384" y="222" text-anchor="middle">≡</text>
  <line class="wire" x1="402" y1="196" x2="478" y2="196"/>
  <line class="wire" x1="402" y1="238" x2="478" y2="238"/>
  <line class="wire" x1="440" y1="196" x2="440" y2="224"/>
