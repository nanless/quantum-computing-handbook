  <line class="wire" x1="829" y1="232.5" x2="829" y2="251.5"/>
  <text class="xs" x="768" y="190" text-anchor="end">|x⟩</text>
  <text class="xs" x="768" y="218" text-anchor="end">|y⟩</text>
  <text class="xs" x="768" y="246" text-anchor="end">|z⟩</text>
  <text class="xs" x="890" y="190">|x⟩</text>
  <text class="xs" x="890" y="218">|y⟩</text>
  <text class="xs" x="890" y="246">|z⊕xy⟩</text>
  <text class="xs" x="848" y="278" text-anchor="middle">经典可逆通用；|z⟩ ↦ |z ⊕ x·y⟩</text>
  <rect class="subpanel" x="42" y="362" width="418" height="132" rx="10"/>
  <text class="smb c4-txt" x="56" y="382">方案一：中段测量 + 经典条件门 U（动态电路）</text>
  <text class="xs" x="54" y="422">寄存器 A</text>
  <text class="xs" x="54" y="472">寄存器 B</text>
  <line class="wire" x1="112" y1="418" x2="176" y2="418"/>
  <rect class="c3-soft" x="176" y="401" width="40" height="34" rx="6"/>
  <path class="axis" stroke-width="1.6" d="M 207.13 421.5 L 206.34 419.91 L 205.33 418.45 L 204.11 417.15 L 202.71 416.05 L 201.17 415.17 L 199.51 414.52 L 197.77 414.13 L 196 414 L 194.23 414.13 L 192.49 414.52 L 190.83 415.17 L 189.29 416.05 L 187.89 417.15 L 186.67 418.45 L 185.66 419.91 L 184.87 421.5"/>
  <line class="c2" stroke-width="1.8" x1="196" y1="426" x2="206.5" y2="411"/>
  <polygon class="c2-fill" points="206.5,411 205.6,416.47 201.67,413.72"/>
  <text class="xs c3-txt" x="211" y="431" text-anchor="end">Z</text>
  <line class="cwire" x1="216" y1="415.4" x2="384" y2="415.4"/>
  <line class="cwire" x1="216" y1="420.6" x2="384" y2="420.6"/>
  <text class="xs c4-txt" x="304" y="405" text-anchor="middle">经典双线 k ∈ {0, 1}</text>
  <text class="sm" x="392" y="422">k</text>
  <line class="wire" x1="112" y1="468" x2="288" y2="468"/>
  <line class="wire" x1="334" y1="468" x2="384" y2="468"/>
  <line class="cwire" x1="308.4" y1="420.6" x2="308.4" y2="450"/>
  <line class="cwire" x1="313.6" y1="420.6" x2="313.6" y2="450"/>
  <circle class="c4-fill" cx="311" cy="418" r="4.0"/>
  <text class="xs c4-txt" x="322" y="439">k = 1</text>
  <rect class="c4-soft" x="288" y="450" width="46" height="36" rx="6"/>
  <text class="gate-txt" x="311" y="474" text-anchor="middle">U</text>
  <text class="xs" x="390" y="465">U<tspan baseline-shift="super" font-size="72%">k</tspan>|ψ<tspan dy="3" font-size="75%">k</tspan><tspan dy="-3">&#8203;</tspan>⟩</text>
  <text class="xs" x="390" y="481">(归一条件态)</text>
  <text class="title c1-txt" x="500" y="430" text-anchor="middle">≡</text>
  <text class="xs c1-txt" x="500" y="450" text-anchor="middle">末端读出</text>
  <text class="xs c1-txt" x="500" y="465" text-anchor="middle">分支相同</text>
  <rect class="subpanel" x="540" y="362" width="418" height="132" rx="10"/>
  <text class="smb c1-txt" x="554" y="382">方案二：量子受控门 C-U + 末端统一测量</text>
  <text class="xs" x="552" y="422">寄存器 A</text>
  <text class="xs" x="552" y="472">寄存器 B</text>
  <line class="wire" x1="610" y1="418" x2="796" y2="418"/>
  <line class="wire" x1="704" y1="418" x2="704" y2="450"/>
