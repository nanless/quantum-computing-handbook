  <text class="xs" x="616" y="278" text-anchor="middle">|x, y⟩ ↦ |y, x⟩（恰好 3 个 CNOT）</text>
  <rect class="subpanel" x="738" y="144" width="220" height="150" rx="10"/>
  <text class="smb c1-txt" x="848" y="165" text-anchor="middle">Toffoli（双控非门 CCNOT）</text>
  <line class="wire" x1="774" y1="186" x2="884" y2="186"/>
  <line class="wire" x1="774" y1="214" x2="884" y2="214"/>
  <line class="wire" x1="774" y1="242" x2="884" y2="242"/>
