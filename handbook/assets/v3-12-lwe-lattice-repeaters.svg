  <text class="xs ink" x="540" y="461">单跳最大损耗 −10 log<tspan dy="3" font-size="9.2">10</tspan><tspan dy="-3">&#8203;</tspan>(0.5) ≈ 3.01 dB ⇒ 纯光纤站距上确界 ≈ 15.05 km</text>
