  <rect class="bg" width="1000" height="580" rx="20"/>
  <text class="title ink" x="34" y="44">LWE 模 17 解密容错圆环与三代量子中继 1000 km 时延对照</text>
  <text class="subtitle muted" x="34" y="68">左：ℤ<tspan dy="3" font-size="9.2">17</tspan><tspan dy="-3">&#8203;</tspan> 奇数解码环对称安全界 |w| ≤ 3、余数 4 碰撞边界与 w=+5 越界反例；右：1000 km 三代中继时延</text>
