<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="v3-12-lwe-lattice-repeaters-title v3-12-lwe-lattice-repeaters-desc">
  <title id="v3-12-lwe-lattice-repeaters-title">LWE 模 17 解密噪声界与三代量子中继 1000 km 时延对照</title>
  <desc id="v3-12-lwe-lattice-repeaters-desc">左面板绘出模 q=17 圆形解码环、m=0 与 m=1 解码扇区、奇数模对称无歧义充分界 |w|&lt;=3（m=0 容 [-4,4]、m=1 编于 8 容 [-3,4]，(m=1,w=-4) 与 (m=0,w=+4) 碰撞于余数 4）、正常解密 w=+2 及越界失败反例 w=+5；右面板用对数纵轴对比 1000 km 光纤上 1G(10 ms)、2G(0.2 ms)、3G(1 us) 的不同操作时标及器件效率改变后的距离上确界。</desc>
