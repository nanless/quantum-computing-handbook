  <text class="xs muted" x="540" y="503">效率 1/.8/.6：15.05/10.21/3.96 km；等号处容量为零。</text>
  <text class="sm muted" x="34" y="554">注：左图展示后量子格密码核心噪声界（与 FIPS 203 ML-KEM 同源），右图为三个分项时标。两层本地门需 2 μs，中点先兆为 100 μs。</text>
