  <text class="xs accent" style="font-weight:600" x="56" y="452">解密：v − s<tspan dy="-4.5" font-size="9.2">T</tspan><tspan dy="4.5">&#8203;</tspan>u ≡ w + 8m (mod 17)，w = e<tspan dy="-4.5" font-size="9.2">T</tspan><tspan dy="4.5">&#8203;</tspan>r + e<tspan dy="3" font-size="9.2">2</tspan><tspan dy="-3">&#8203;</tspan> − s<tspan dy="-4.5" font-size="9.2">T</tspan><tspan dy="4.5">&#8203;</tspan>e<tspan dy="3" font-size="9.2">1</tspan><tspan dy="-3">&#8203;</tspan></text>
