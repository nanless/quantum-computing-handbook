  <line class="axis" x1="114.0" y1="302.0" x2="456.0" y2="302.0"/>
  <rect class="note" x="30.0" y="334.0" width="436.0" height="90.0" rx="7.0"/>
  <text class="smb" x="40.0" y="353.0">吞吐底线：均值 t̄_dec &lt; τ_cyc ≈ 1 μs，否则触发 Terhal 指数积压</text>
  <text class="sm" x="40.0" y="373.0">端到端反应时间：τ_react = τ_readout + τ_comm + τ_dec,win + τ_fb</text>
  <text class="sm" x="40.0" y="393.0">实测参照：Willow 流式平均 63 μs（周期 1.1 μs）；目标 ≤ 10 μs</text>
  <text class="sm c2-txt" x="40.0" y="413.0">尾延迟陷阱：均值达标不等于 p99/max 尾延迟不击穿 τ_react 预算</text>
  <rect class="panel" x="488.0" y="64.0" width="452.0" height="370.0" rx="10.0"/>
  <rect class="phead" x="489.0" y="65.0" width="450.0" height="28.0" rx="9.0"/>
