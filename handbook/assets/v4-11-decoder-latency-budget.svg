<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">容错实时解码单轮延迟预算与物理比特资源分解</title>
  <desc id="desc">左面板以瀑布条分解超导表面码单轮 1.0 μs 延迟预算（物理读出 300 ns、信号传输 140 ns、症状匹配 340 ns 及 p99 重尾风险、条件前馈 120 ns，合计 0.90 μs &lt; 1.0 μs），并区分单轮吞吐与端到端反应时间 τ_react；右面板按第 11 章精确数据对比三种表面码架构（Litinski 方案 A、面积压缩方案 B 与 Gidney 2025 轭联+培育）的数据、路由与魔法态物理比特占比。</desc>
  <style>
