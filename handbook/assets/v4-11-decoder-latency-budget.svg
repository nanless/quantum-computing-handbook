  <text class="smb" x="510.0" y="361.0">① 传统双级 15-to-1 蒸馏工厂可占活跃物理比特的 56%（方案 A）</text>
  <text class="sm" x="510.0" y="381.0">② 缩减工厂数会拉长运行时长 5×，迫使存储区码距 d: 23 → 25</text>
  <text class="sm" x="510.0" y="401.0">③ 魔法态培育 (MSC) + 轭联冷存把数据区占比提至 61.3%</text>
  <text class="sm" x="510.0" y="417.0">注：三组均对应理论均匀噪声估算，尚未计入芯片良率与关联突发错。</text>
  <text class="sm" x="22.0" y="450.0">数据口径：第 11 章 §7.3、§8.2–§8.3（p = 10⁻³、τ_cyc = 1 μs、单瓦片 2d²；非等比例硬件流程示意与精确占比对照）。</text>
</svg>
