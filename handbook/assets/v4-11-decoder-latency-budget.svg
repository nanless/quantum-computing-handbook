  <text class="title" x="22.0" y="33.0">容错实时解码单轮延迟预算与物理比特资源分解</text>
  <text class="subtitle" x="22.0" y="52.0">左：超导表面码 τ_cyc ≈ 1.0 μs 吞吐预算瀑布与 p99 重尾风险；右：表面码数据、路由与魔法态工厂物理比特占比</text>
  <rect class="panel" x="20.0" y="64.0" width="456.0" height="370.0" rx="10.0"/>
  <rect class="phead" x="21.0" y="65.0" width="454.0" height="28.0" rx="9.0"/>
