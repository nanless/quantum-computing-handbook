  <text class="badge-txt" x="806.7" y="168.0" text-anchor="middle">56.3% (600k)</text>
  <text class="smb" x="502.0" y="205.0">方案 B（面积压缩，d=25，4 座工厂，共 671k，时长 5×）</text>
  <rect class="c1-fill" x="502.0" y="212.0" width="157.9" height="28.0" rx="3.0"/>
