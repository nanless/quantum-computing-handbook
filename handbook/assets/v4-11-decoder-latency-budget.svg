  <rect class="c2-soft" x="346.0" y="194.0" width="92.2" height="22.0" rx="4.0" stroke-dasharray="4 3"/>
  <text class="smb c2-txt" x="392.1" y="209.5" text-anchor="middle">p99 重尾</text>
  <text class="lblb" x="106.0" y="245.5" text-anchor="end">条件前馈</text>
